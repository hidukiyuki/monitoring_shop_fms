name: FINDME STORE Monitor

on:
  # 6時間ごと
  schedule:
    - cron: "17 */6 * * *"

  # GitHub画面から手動実行可能
  workflow_dispatch:

# 同じ監視処理が同時実行されるのを防ぐ
concurrency:
  group: shop-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ======================================================
      # Git configuration
      # ======================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ======================================================
      # Get latest main
      #
      # 重要:
      # monitor_shop.py より前に実行する
      # ======================================================

      - name: Pull latest changes
        run: |
          git pull --rebase origin main

      # ======================================================
      # Run monitor
      # ======================================================

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python scripts/monitor_shop.py

      # ======================================================
      # Copy monitors.json for GitHub Pages
      # ======================================================

      - name: Copy monitors.json to Pages
        run: |
          mkdir -p docs
          cp config/monitors.json docs/monitors.json

      # ======================================================
      # Debug
      #
      # JSON / CSVが本当に生成されているか確認
      # ======================================================

      - name: Show generated files
        run: |
          echo "========================================"
          echo "data/"
          echo "========================================"

          find data -type f -print || true

          echo ""
          echo "========================================"
          echo "docs/data/"
          echo "========================================"

          find docs/data -type f -print || true

          echo ""
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status --short

      # ======================================================
      # Stage
      # ======================================================

      - name: Stage generated files
        run: |
          git add -A

      # ======================================================
      # Show staged changes
      # ======================================================

      - name: Show staged changes
        run: |
          echo "========================================"
          echo "Staged files"
          echo "========================================"

          git status --short

          echo ""
          echo "========================================"
          echo "Changed files"
          echo "========================================"

          git diff --cached --name-status

      # ======================================================
      # Commit & Push
      # ======================================================

      - name: Commit and push
        run: |

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update FINDME STORE monitoring data"

            git push origin HEAD:main

          fi
