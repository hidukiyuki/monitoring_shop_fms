name: FINDME STORE Monitor

on:
  # 6時間ごと
  schedule:
    - cron: "17 */6 * * *"

  # GitHub画面から手動実行可能
  workflow_dispatch:

# 同じ監視処理が同時実行されるのを防ぐ
concurrency:
  group: shop-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # 1. GitHubリポジトリを取得
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==================================================
      # 2. Pythonセットアップ
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # 3. Python依存関係をインストール
      #
      # requirements.txt が存在する場合だけ実行
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ==================================================
      # 4. 必須ファイル確認
      # ==================================================
      - name: Check required files
        run: |
          test -f scripts/monitor_shop.py
          test -f config/monitors.json

      # ==================================================
      # 5. データディレクトリを作成
      #
      # Gitでは空フォルダを保持できないため、
      # Actions実行時にも必ず作成する
      # ==================================================
      - name: Prepare data directories
        run: |
          mkdir -p docs/data
          mkdir -p docs/data/history
          mkdir -p docs/data/csv

      # ==================================================
      # 6. 商品監視
      #
      # monitor_shop.py が
      # config/monitors.json を読み込む
      #
      # JSON / CSV / 履歴の生成
      # Discord差分通知などは
      # monitor_shop.py 側で処理
      # ==================================================
      - name: Run scripts/monitor_shop.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/monitor_shop.py

      # ==================================================
      # 7. monitors.jsonをPages側へ同期
      #
      # config/monitors.jsonを正本とする
      #
      # index.html
      #     ↓
      # docs/monitors.json
      #
      # を読み込む
      # ==================================================
      - name: Sync monitors.json
        run: |
          cp config/monitors.json docs/monitors.json

      # ==================================================
      # 8. 生成結果を確認
      #
      # Actionsログから
      # JSON / CSVが実際に生成されたか確認できる
      # ==================================================
      - name: Show generated data
        run: |
          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find docs/data \
            -type f \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status --short

      # ==================================================
      # 9. Git設定
      # ==================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ==================================================
      # 10. 生成ファイルをcommit
      #
      # 変更がない場合は正常終了
      # ==================================================
      - name: Commit generated data
        run: |

          git add docs/data
          git add docs/monitors.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Update monitored shop data"

      # ==================================================
      # 11. 最新mainを取得してpush
      #
      # git pull --rebase は使用しない
      #
      # Actions開始後にmainへ別commitが入った場合は
      # origin/mainへrebaseしてからpushする
      # ==================================================
      - name: Push changes
        run: |

          git fetch origin main

          LOCAL_COMMIT="$(git rev-parse HEAD)"
          REMOTE_COMMIT="$(git rev-parse origin/main)"

          echo "Local : $LOCAL_COMMIT"
          echo "Remote: $REMOTE_COMMIT"


          # ------------------------------------------------
          # origin/mainが現在のコミットの祖先なら
          # そのままpush可能
          # ------------------------------------------------
          if git merge-base --is-ancestor \
            "$REMOTE_COMMIT" \
            "$LOCAL_COMMIT"
          then

            echo "Local branch contains origin/main."

          else

            echo "origin/main has newer commits."

            echo "Rebasing generated commit..."

            git rebase origin/main

          fi


          # ------------------------------------------------
          # mainへpush
          # ------------------------------------------------
          git push origin HEAD:main
