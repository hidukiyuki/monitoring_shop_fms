name: Monitor FINDME STORE

on:

  schedule:

    # 毎時17分
    # 00分を避けてGitHub Actionsの混雑を多少回避
    - cron: "17 * * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:


      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v5

        with:
          fetch-depth: 0


      # --------------------------------------------------
      # Python
      # --------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      # --------------------------------------------------
      # Dependencies
      # --------------------------------------------------

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests


      # --------------------------------------------------
      # Monitor
      # --------------------------------------------------

      - name: Monitor shop

        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |

          python scripts/monitor_shop.py


      # --------------------------------------------------
      # Check git changes
      # --------------------------------------------------

      - name: Check changes

        id: changes

        run: |

          if git diff --quiet; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # Commit
      # --------------------------------------------------

      - name: Commit and push

        if:
          steps.changes.outputs.changed == 'true'

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/products.json \
            data/products.csv \
            docs/data/products.json


          git commit \
            -m "Update FINDME STORE product data"


          git pull \
            --rebase \
            origin main


          git push \
            origin main