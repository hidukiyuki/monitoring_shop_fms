name: Monitor FINDME STORE

on:
  schedule:
    # UTC
    # JSTでは 03:17 / 09:17 / 15:17 / 21:17
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

# 同じ監視が同時に走らないようにする
concurrency:
  group: findme-store-monitor

  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout

        uses: actions/checkout@v5

        with:
          fetch-depth: 0

      - name: Setup Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests

      - name: Monitor shop

        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |

          python scripts/monitor_shop.py

      - name: Check changes

        id: changes

        run: |

          if git diff --quiet; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

          fi

      - name: Commit and push

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/products.json \
            data/products.csv \
            data/history.json \
            data/history.csv \
            docs/data/products.json \
            docs/data/history.json


          git commit \
            -m "Update FINDME STORE data"


          git pull \
            --rebase \
            origin main


          git push \
            origin main
