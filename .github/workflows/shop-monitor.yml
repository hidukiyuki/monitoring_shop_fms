name: Monitor FINDME STORE

on:
  schedule:
    # 6時間ごと
    #
    # UTC:
    # 00:17
    # 06:17
    # 12:17
    # 18:17
    #
    # JST:
    # 09:17
    # 15:17
    # 21:17
    # 03:17
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

# 同じWorkflowを同時に実行しない
concurrency:
  group: findme-store-monitor

  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v5

        with:
          fetch-depth: 0

      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"

      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests

      # ======================================================
      # Validate config
      # ======================================================

      - name: Validate monitors.json

        run: |

          python - <<'PY'

          import json

          from pathlib import Path


          path = Path(
              "config/monitors.json"
          )


          with path.open(
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          monitors = data.get(
              "monitors"
          )


          if not isinstance(
              monitors,
              list
          ) or not monitors:

              raise SystemExit(
                  "No monitors configured."
              )


          print(
              f"Monitors: {len(monitors)}"
          )


          for monitor in monitors:

              print(
                  f"- {monitor['name']}"
                  f" / "
                  f"{monitor['collection']}"
                  f" / "
                  f"pages={monitor['pages']}"
              )

          PY

      # ======================================================
      # GitHub Pages用設定
      # ======================================================

      - name: Copy monitors.json to Pages

        run: |

          mkdir -p docs

          cp \
            config/monitors.json \
            docs/monitors.json

      # ======================================================
      # Monitor
      # ======================================================

      - name: Run monitor

        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |

          python scripts/monitor_shop.py

      # ======================================================
      # Git status
      # ======================================================

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python scripts/monitor_shop.py

      - name: Show generated files
        run: |
          echo "===== data ====="
          find data -type f -maxdepth 3 -print

          echo "===== docs/data ====="
          find docs/data -type f -maxdepth 3 -print

          echo "===== git status ====="
          git status --short

      - name: Copy monitors.json to Pages
        run: |
          mkdir -p docs
          cp config/monitors.json docs/monitors.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          git pull --rebase origin main

      - name: Stage generated files
        run: |
          git add -A

      - name: Show staged changes
        run: |
          echo "===== staged files ====="
          git status --short

      - name: Commit
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FINDME STORE monitoring data"
          fi

      - name: Push
        run: |
          git push origin HEAD:main
