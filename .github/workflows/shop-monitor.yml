name: Monitor FINDME STORE

on:
  schedule:
    # 6時間ごと
    # UTC: 00:17 / 06:17 / 12:17 / 18:17
    # JST: 09:17 / 15:17 / 21:17 / 03:17
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: findme-store-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate monitor config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/monitors.json")

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          monitors = data.get("monitors")

          assert isinstance(monitors, list)
          assert monitors

          print(
              f"Configured monitors: {len(monitors)}"
          )

          for monitor in monitors:
              print(
                  f"- {monitor['name']}: "
                  f"pages={monitor['pages']}"
              )
          PY

      - name: Copy config for GitHub Pages
        run: |
          cp config/monitors.json docs/monitors.json

      - name: Monitor shop
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python scripts/monitor_shop.py

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            config/ \
            data/ \
            docs/

          git commit \
            -m "Update FINDME STORE data"

          git pull \
            --rebase \
            origin main

          git push \
            origin main
