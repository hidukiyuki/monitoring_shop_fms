<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FINDME STORE Monitor</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #f5f5f5;
        color: #222;
      }

      header {
        background: #111;
        color: #fff;
        padding: 20px;
      }

      header h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      #lastUpdated {
        font-size: 13px;
        opacity: 0.75;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      /* =========================
       Tabs
       ========================= */

      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .tab {
        border: 0;
        padding: 10px 18px;
        border-radius: 8px;
        background: #ddd;
        cursor: pointer;
        font-size: 14px;
      }

      .tab:hover {
        background: #ccc;
      }

      .tab.active {
        background: #111;
        color: #fff;
      }

      /* =========================
       Controls
       ========================= */

      .controls {
        display: grid;
        grid-template-columns:
          minmax(200px, 2fr)
          minmax(150px, 1fr)
          minmax(150px, 1fr)
          minmax(150px, 1fr);

        gap: 10px;
        margin-bottom: 20px;
      }

      input,
      select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 7px;
        background: #fff;
        font-size: 14px;
      }

      /* =========================
       Status
       ========================= */

      .status {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;

        margin-bottom: 20px;
        padding: 12px 15px;

        background: #fff;
        border-radius: 8px;

        font-size: 14px;
      }

      .error {
        padding: 15px;
        margin-bottom: 20px;

        background: #ffe5e5;
        border: 1px solid #ffb0b0;

        color: #b00000;
        border-radius: 8px;

        white-space: pre-wrap;
      }

      .loading {
        padding: 30px;
        text-align: center;
        color: #666;
      }

      /* =========================
       Products
       ========================= */

      .products {
        display: grid;

        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

        gap: 20px;
      }

      .product {
        background: #fff;
        border-radius: 10px;
        overflow: hidden;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .product:hover {
        transform: translateY(-2px);

        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);
      }

      .product-image {
        width: 100%;
        aspect-ratio: 1 / 1;

        object-fit: cover;

        background: #eee;
        display: block;
      }

      .product-body {
        padding: 15px;
      }

      .product-title {
        font-size: 17px;
        font-weight: 600;

        margin-bottom: 8px;
        line-height: 1.4;
      }

      .product-price {
        font-size: 18px;
        font-weight: 700;

        margin-bottom: 10px;
      }

      .sku {
        font-size: 13px;
        color: #555;

        margin-bottom: 5px;
      }

      .date {
        font-size: 12px;
        color: #777;

        margin-top: 4px;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;

        margin-top: 10px;
      }

      .tag {
        padding: 4px 7px;

        background: #eee;
        border-radius: 5px;

        font-size: 11px;
      }

      /* =========================
       Status badge
       ========================= */

      .availability {
        display: inline-block;

        padding: 5px 8px;

        border-radius: 5px;

        font-size: 12px;
        font-weight: 600;

        margin-bottom: 8px;
      }

      .available {
        background: #e5f7e5;
        color: #168316;
      }

      .soldout {
        background: #eee;
        color: #777;
      }

      .product-link {
        display: inline-block;

        margin-top: 12px;

        color: #0066cc;
        text-decoration: none;

        font-size: 13px;
      }

      .product-link:hover {
        text-decoration: underline;
      }

      /* =========================
       Responsive
       ========================= */

      @media (max-width: 900px) {
        .controls {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 600px) {
        .container {
          padding: 12px;
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .products {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>FINDME STORE Monitor</h1>

      <div id="lastUpdated">Loading...</div>
    </header>

    <div class="container">
      <!-- =========================
       Tabs
       ========================= -->

      <div id="tabs" class="tabs"></div>

      <!-- =========================
       Error
       ========================= -->

      <div id="error" class="error" style="display: none"></div>

      <!-- =========================
       Controls
       ========================= -->

      <div id="controls" class="controls" style="display: none">
        ```
        <input id="search" type="search" placeholder="商品名・SKUを検索" />

        <select id="tagFilter">
          <option value="">すべてのタグ</option>
        </select>

        <select id="availabilityFilter">
          <option value="all">すべて</option>

          <option value="available">販売中</option>

          <option value="soldout">Sold out</option>
        </select>

        <select id="priceSort">
          <option value="default">並び順</option>

          <option value="asc">価格が安い順</option>

          <option value="desc">価格が高い順</option>
        </select>
        ```
      </div>

      <!-- =========================
       Status
       ========================= -->

      <div id="status" class="status" style="display: none"></div>

      <!-- =========================
       Products
       ========================= -->

      <div id="loading" class="loading">データを読み込んでいます...</div>

      <div id="products" class="products"></div>
    </div>

    <script>
      "use strict";

      /* =========================================================
   Global
   ========================================================= */

      let monitors = [];

      let currentMonitor = null;

      let currentProducts = [];

      let originalProducts = [];

      let lastUpdated = null;

      /* =========================================================
   DOM
   ========================================================= */

      const tabsEl = document.getElementById("tabs");

      const productsEl = document.getElementById("products");

      const loadingEl = document.getElementById("loading");

      const errorEl = document.getElementById("error");

      const statusEl = document.getElementById("status");

      const controlsEl = document.getElementById("controls");

      const searchEl = document.getElementById("search");

      const tagFilterEl = document.getElementById("tagFilter");

      const availabilityFilterEl =
        document.getElementById("availabilityFilter");

      const priceSortEl = document.getElementById("priceSort");

      const lastUpdatedEl = document.getElementById("lastUpdated");

      /* =========================================================
   Utility
   ========================================================= */

      function showError(message) {
        errorEl.textContent = message;

        errorEl.style.display = "block";
      }

      function clearError() {
        errorEl.textContent = "";

        errorEl.style.display = "none";
      }

      function escapeHtml(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return escapeHtml(value);
        }

        return date.toLocaleString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatPrice(value) {
        const number = Number(value);

        if (Number.isNaN(number)) {
          return value || "-";
        }

        return new Intl.NumberFormat("ja-JP").format(number) + "円";
      }

      /* =========================================================
   Monitor configuration
   ========================================================= */

      async function loadMonitors() {
        const response = await fetch("./monitors.json?t=" + Date.now());

        if (!response.ok) {
          throw new Error(
            "monitors.json の取得に失敗しました: HTTP " + response.status,
          );
        }

        const data = await response.json();

        /*
         * 対応形式
         *
         * [
         *   {...}
         * ]
         *
         * または
         *
         * {
         *   "monitors": [...]
         * }
         */

        if (Array.isArray(data)) {
          monitors = data;
        } else if (data && Array.isArray(data.monitors)) {
          monitors = data.monitors;
        } else {
          throw new Error("monitors.json の形式が正しくありません");
        }

        if (monitors.length === 0) {
          throw new Error("監視対象がありません");
        }
      }

      /* =========================================================
   Monitor properties
   ========================================================= */

      function getMonitorName(monitor) {
        return (
          monitor.name ||
          monitor.title ||
          monitor.collection ||
          monitor.slug ||
          "Monitor"
        );
      }

      function getMonitorCollection(monitor) {
        return monitor.collection || monitor.slug || monitor.name;
      }

      function getProductsPath(monitor) {
        /*
         * 明示的なproducts_pathがあれば優先
         */

        if (monitor.products_path) {
          return monitor.products_path;
        }

        /*
         * collectionから自動生成
         */

        const collection = getMonitorCollection(monitor);

        return "./data/" + encodeURIComponent(collection) + "/products.json";
      }

      /* =========================================================
   Tabs
   ========================================================= */

      function renderTabs() {
        tabsEl.innerHTML = "";

        monitors.forEach((monitor, index) => {
          const button = document.createElement("button");

          button.className = "tab" + (index === 0 ? " active" : "");

          button.textContent = getMonitorName(monitor);

          button.addEventListener("click", () => {
            document
              .querySelectorAll(".tab")
              .forEach((tab) => tab.classList.remove("active"));

            button.classList.add("active");

            loadMonitor(monitor);
          });

          tabsEl.appendChild(button);
        });
      }

      /* =========================================================
   Products JSON
   ========================================================= */

      async function loadProducts(monitor) {
        const path = getProductsPath(monitor);

        const response = await fetch(
          path + (path.includes("?") ? "&" : "?") + "t=" + Date.now(),
        );

        if (!response.ok) {
          throw new Error(
            "products.json の取得に失敗しました: HTTP " + response.status,
          );
        }

        const data = await response.json();

        /*
         * ① 配列形式
         *
         * [
         *   {...}
         * ]
         */

        if (Array.isArray(data)) {
          return data;
        }

        /*
         * ② Shopify形式
         *
         * {
         *   "products": [...]
         * }
         */

        if (data && Array.isArray(data.products)) {
          return data.products;
        }

        throw new Error("products.json の形式が正しくありません");
      }

      /* =========================================================
   Product normalization
   ========================================================= */

      function getVariant(product) {
        if (
          !product ||
          !Array.isArray(product.variants) ||
          product.variants.length === 0
        ) {
          return null;
        }

        /*
         * 最初のvariantを基本表示に使用
         */

        return product.variants[0];
      }

      function getSku(product) {
        const variant = getVariant(product);

        if (!variant) {
          return "";
        }

        return variant.sku || "";
      }

      function getPrice(product) {
        const variant = getVariant(product);

        if (!variant) {
          return 0;
        }

        const value = Number(variant.price);

        return Number.isNaN(value) ? 0 : value;
      }

      function isAvailable(product) {
        /*
         * Shopifyのvariantsから判定
         */

        if (Array.isArray(product.variants)) {
          return product.variants.some((variant) => variant.available === true);
        }

        /*
         * product-level fallback
         */

        if (typeof product.available === "boolean") {
          return product.available;
        }

        return false;
      }

      function getCreatedAt(product) {
        const variant = getVariant(product);

        return variant?.created_at || product.created_at || "";
      }

      function getUpdatedAt(product) {
        const variant = getVariant(product);

        return variant?.updated_at || product.updated_at || "";
      }

      function getImage(product) {
        /*
         * Shopify product images
         */

        if (Array.isArray(product.images) && product.images.length > 0) {
          const image = product.images[0];

          if (typeof image === "string") {
            return image;
          }

          return image.src || image.url || "";
        }

        /*
         * image fallback
         */

        if (typeof product.image === "string") {
          return product.image;
        }

        if (product.image && typeof product.image === "object") {
          return product.image.src || product.image.url || "";
        }

        return "";
      }

      function getProductUrl(product) {
        /*
         * URLが保存されている場合
         */

        if (product.url) {
          return product.url;
        }

        /*
         * Shopify handle
         */

        if (product.handle) {
          return (
            "https://findmestore.thinkr.jp/products/" +
            encodeURIComponent(product.handle)
          );
        }

        return "";
      }

      /* =========================================================
   Tags
   ========================================================= */

      function getTags(product) {
        if (Array.isArray(product.tags)) {
          return product.tags;
        }

        if (typeof product.tags === "string") {
          return product.tags
            .split(",")
            .map((tag) => tag.trim())
            .filter(Boolean);
        }

        return [];
      }

      /* =========================================================
   Tag filter
   ========================================================= */

      function updateTagFilter() {
        const current = tagFilterEl.value;

        const tags = new Set();

        originalProducts.forEach((product) => {
          getTags(product).forEach((tag) => tags.add(tag));
        });

        tagFilterEl.innerHTML = '<option value="">すべてのタグ</option>';

        Array.from(tags)
          .sort((a, b) => a.localeCompare(b, "ja"))
          .forEach((tag) => {
            const option = document.createElement("option");

            option.value = tag;

            option.textContent = tag;

            tagFilterEl.appendChild(option);
          });

        if (Array.from(tags).includes(current)) {
          tagFilterEl.value = current;
        }
      }

      /* =========================================================
   Filtering
   ========================================================= */

      function getFilteredProducts() {
        const keyword = searchEl.value.trim().toLowerCase();

        const selectedTag = tagFilterEl.value;

        const availability = availabilityFilterEl.value;

        let products = originalProducts.filter((product) => {
          /*
           * Search
           */

          if (keyword) {
            const title = String(product.title || "").toLowerCase();

            const sku = getSku(product).toLowerCase();

            if (!title.includes(keyword) && !sku.includes(keyword)) {
              return false;
            }
          }

          /*
           * Tag
           */

          if (selectedTag && !getTags(product).includes(selectedTag)) {
            return false;
          }

          /*
           * Availability
           */

          const available = isAvailable(product);

          if (availability === "available" && !available) {
            return false;
          }

          if (availability === "soldout" && available) {
            return false;
          }

          return true;
        });

        /*
         * Price sort
         */

        const sort = priceSortEl.value;

        if (sort === "asc") {
          products.sort((a, b) => getPrice(a) - getPrice(b));
        }

        if (sort === "desc") {
          products.sort((a, b) => getPrice(b) - getPrice(a));
        }

        return products;
      }

      /* =========================================================
   Render products
   ========================================================= */

      function renderProducts() {
        productsEl.innerHTML = "";

        const products = getFilteredProducts();

        if (products.length === 0) {
          productsEl.innerHTML =
            '<div class="loading">' + "該当する商品がありません。" + "</div>";

          updateStatus(products.length);

          return;
        }

        products.forEach((product) => {
          const card = document.createElement("div");

          card.className = "product";

          const image = getImage(product);

          const available = isAvailable(product);

          const sku = getSku(product);

          const price = getPrice(product);

          const createdAt = getCreatedAt(product);

          const updatedAt = getUpdatedAt(product);

          const url = getProductUrl(product);

          const tags = getTags(product);

          /*
           * Image
           */

          if (image) {
            const img = document.createElement("img");

            img.className = "product-image";

            img.src = image;

            img.alt = product.title || "";

            img.loading = "lazy";

            img.onerror = function () {
              this.style.display = "none";
            };

            card.appendChild(img);
          }

          /*
           * Body
           */

          const body = document.createElement("div");

          body.className = "product-body";

          /*
           * Availability
           */

          const availabilityEl = document.createElement("div");

          availabilityEl.className =
            "availability " + (available ? "available" : "soldout");

          availabilityEl.textContent = available ? "販売中" : "Sold out";

          body.appendChild(availabilityEl);

          /*
           * Title
           */

          const titleEl = document.createElement("div");

          titleEl.className = "product-title";

          titleEl.textContent = product.title || "名称未設定";

          body.appendChild(titleEl);

          /*
           * Price
           */

          const priceEl = document.createElement("div");

          priceEl.className = "product-price";

          priceEl.textContent = formatPrice(price);

          body.appendChild(priceEl);

          /*
           * SKU
           */

          if (sku) {
            const skuEl = document.createElement("div");

            skuEl.className = "sku";

            skuEl.innerHTML = "<strong>SKU:</strong> " + escapeHtml(sku);

            body.appendChild(skuEl);
          }

          /*
           * Created
           */

          const createdEl = document.createElement("div");

          createdEl.className = "date";

          createdEl.innerHTML =
            "<strong>作成:</strong> " + escapeHtml(formatDate(createdAt));

          body.appendChild(createdEl);

          /*
           * Updated
           */

          const updatedEl = document.createElement("div");

          updatedEl.className = "date";

          updatedEl.innerHTML =
            "<strong>更新:</strong> " + escapeHtml(formatDate(updatedAt));

          body.appendChild(updatedEl);

          /*
           * Tags
           */

          if (tags.length > 0) {
            const tagsEl = document.createElement("div");

            tagsEl.className = "tags";

            tags.forEach((tag) => {
              const tagEl = document.createElement("span");

              tagEl.className = "tag";

              tagEl.textContent = tag;

              tagsEl.appendChild(tagEl);
            });

            body.appendChild(tagsEl);
          }

          /*
           * Product link
           */

          if (url) {
            const link = document.createElement("a");

            link.className = "product-link";

            link.href = url;

            link.target = "_blank";

            link.rel = "noopener noreferrer";

            link.textContent = "商品ページを開く →";

            body.appendChild(link);
          }

          card.appendChild(body);

          productsEl.appendChild(card);
        });

        updateStatus(products.length);
      }

      /* =========================================================
   Status
   ========================================================= */

      function updateStatus(displayedCount) {
        const total = originalProducts.length;

        const available = originalProducts.filter((product) =>
          isAvailable(product),
        ).length;

        const soldout = total - available;

        statusEl.innerHTML =
          "<span>商品数: <strong>" +
          total +
          "</strong></span>" +
          "<span>表示中: <strong>" +
          displayedCount +
          "</strong></span>" +
          "<span>販売中: <strong>" +
          available +
          "</strong></span>" +
          "<span>Sold out: <strong>" +
          soldout +
          "</strong></span>";

        statusEl.style.display = "flex";
      }

      /* =========================================================
   Load monitor
   ========================================================= */

      async function loadMonitor(monitor) {
        currentMonitor = monitor;

        loadingEl.style.display = "block";

        productsEl.innerHTML = "";

        controlsEl.style.display = "none";

        statusEl.style.display = "none";

        clearError();

        try {
          const products = await loadProducts(monitor);

          originalProducts = Array.isArray(products) ? products : [];

          currentProducts = [...originalProducts];

          /*
           * Tags
           */

          updateTagFilter();

          /*
           * Controls
           */

          controlsEl.style.display = "grid";

          /*
           * Render
           */

          renderProducts();

          /*
           * 最終更新時刻
           *
           * JSONそのものの更新時刻は
           * GitHub Pagesでは取得できないため、
           * ページ読み込み時刻を表示
           */

          lastUpdated = new Date();

          lastUpdatedEl.textContent =
            "最終読み込み: " + formatDate(lastUpdated);
        } catch (error) {
          console.error(error);

          showError(error.message || "データの読み込みに失敗しました");
        } finally {
          loadingEl.style.display = "none";
        }
      }

      /* =========================================================
   Events
   ========================================================= */

      searchEl.addEventListener("input", () => {
        renderProducts();
      });

      tagFilterEl.addEventListener("change", () => {
        renderProducts();
      });

      availabilityFilterEl.addEventListener("change", () => {
        renderProducts();
      });

      priceSortEl.addEventListener("change", () => {
        renderProducts();
      });

      /* =========================================================
   Initial
   ========================================================= */

      async function init() {
        try {
          await loadMonitors();

          renderTabs();

          await loadMonitor(monitors[0]);
        } catch (error) {
          console.error(error);

          loadingEl.style.display = "none";

          showError(error.message || "初期化に失敗しました");
        }
      }

      init();
    </script>
  </body>
</html>
