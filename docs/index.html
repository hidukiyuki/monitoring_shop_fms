<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FINDME STORE Monitor</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
          sans-serif;

        background: #f5f5f5;

        color: #222;
      }

      button,
      input,
      select {
        font: inherit;
      }

      /* =====================================================
       Header
       ===================================================== */

      header {
        background: #111;

        color: #fff;

        padding: 20px;
      }

      header h1 {
        margin: 0 0 8px;

        font-size: 24px;

        line-height: 1.3;
      }

      #lastUpdated {
        font-size: 13px;

        opacity: 0.75;
      }

      .container {
        width: 100%;

        max-width: 1600px;

        margin: 0 auto;

        padding: 20px;
      }

      /* =====================================================
       Tabs
       ===================================================== */

      .tabs {
        display: flex;

        flex-wrap: wrap;

        gap: 8px;

        margin-bottom: 20px;
      }

      .tab {
        border: 0;

        padding: 10px 18px;

        border-radius: 8px;

        background: #ddd;

        color: #222;

        cursor: pointer;

        font-size: 14px;

        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .tab:hover {
        background: #ccc;
      }

      .tab.active {
        background: #111;

        color: #fff;
      }

      /* =====================================================
       Error
       ===================================================== */

      .error {
        margin-bottom: 20px;

        padding: 15px;

        border: 1px solid #ffb0b0;

        border-radius: 8px;

        background: #ffe5e5;

        color: #b00000;

        white-space: pre-wrap;

        word-break: break-word;

        font-size: 13px;

        line-height: 1.6;
      }

      /* =====================================================
       Controls
       ===================================================== */

      .main-controls {
        display: flex;

        flex-wrap: wrap;

        align-items: center;

        gap: 10px;

        margin-bottom: 15px;
      }

      .search-box {
        flex: 1 1 300px;

        min-width: 220px;
      }

      input,
      select {
        width: 100%;

        min-height: 42px;

        padding: 9px 11px;

        border: 1px solid #ccc;

        border-radius: 7px;

        outline: none;

        background: #fff;

        color: #222;

        font-size: 14px;
      }

      input:focus,
      select:focus {
        border-color: #777;

        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06);
      }

      .sort-box {
        width: 250px;
      }

      /* =====================================================
       View switch
       ===================================================== */

      .view-switch {
        display: flex;

        flex-shrink: 0;

        gap: 4px;

        padding: 4px;

        border: 1px solid #ddd;

        border-radius: 8px;

        background: #fff;
      }

      .view-button {
        border: 0;

        padding: 7px 14px;

        border-radius: 6px;

        background: transparent;

        color: #333;

        cursor: pointer;

        font-size: 13px;
      }

      .view-button.active {
        background: #111;

        color: #fff;
      }

      /* =====================================================
       Filter panel
       ===================================================== */

      .filter-panel {
        margin-bottom: 20px;

        padding: 15px;

        border: 1px solid #e5e5e5;

        border-radius: 10px;

        background: #fff;
      }

      .filter-section {
        margin-bottom: 15px;
      }

      .filter-section:last-of-type {
        margin-bottom: 10px;
      }

      .filter-title {
        margin-bottom: 8px;

        font-size: 13px;

        font-weight: 700;
      }

      .filter-buttons {
        display: flex;

        flex-wrap: wrap;

        gap: 6px;
      }

      .filter-button {
        border: 1px solid #ccc;

        padding: 6px 10px;

        border-radius: 20px;

        background: #fff;

        color: #333;

        cursor: pointer;

        font-size: 12px;

        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .filter-button:hover {
        background: #eee;
      }

      .filter-button.active {
        border-color: #111;

        background: #111;

        color: #fff;
      }

      .clear-filters {
        border: 0;

        padding: 7px 11px;

        border-radius: 6px;

        background: #eee;

        color: #333;

        cursor: pointer;

        font-size: 12px;
      }

      .clear-filters:hover {
        background: #ddd;
      }

      /* =====================================================
       Status
       ===================================================== */

      .status {
        display: flex;

        flex-wrap: wrap;

        gap: 15px;

        margin-bottom: 20px;

        padding: 12px 15px;

        border-radius: 8px;

        background: #fff;

        font-size: 14px;
      }

      /* =====================================================
       Loading
       ===================================================== */

      .loading {
        padding: 30px;

        text-align: center;

        color: #666;

        font-size: 14px;
      }

      /* =====================================================
       Products - Card
       ===================================================== */

      .products {
        display: grid;

        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

        gap: 20px;
      }

      .product {
        overflow: hidden;

        border-radius: 10px;

        background: #fff;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .product:hover {
        transform: translateY(-2px);

        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);
      }

      .product-image {
        display: block;

        width: 100%;

        aspect-ratio: 1 / 1;

        object-fit: cover;

        background: #eee;
      }

      .product-body {
        padding: 15px;
      }

      .product-title {
        margin-bottom: 8px;

        font-size: 17px;

        font-weight: 600;

        line-height: 1.4;
      }

      .product-price {
        margin-bottom: 10px;

        font-size: 18px;

        font-weight: 700;
      }

      /* =====================================================
       Availability
       ===================================================== */

      .availability {
        display: inline-block;

        margin-bottom: 8px;

        padding: 5px 8px;

        border-radius: 5px;

        font-size: 12px;

        font-weight: 600;
      }

      .available {
        background: #e5f7e5;

        color: #168316;
      }

      .soldout {
        background: #eee;

        color: #777;
      }

      /* =====================================================
       Product meta
       ===================================================== */

      .product-meta {
        min-width: 0;
      }

      .sku {
        margin: 0;

        font-size: 13px;

        color: #555;

        line-height: 1.5;
      }

      /* =====================================================
       Category chips
       ===================================================== */

      .category-label {
        margin-top: 8px;

        font-size: 11px;

        font-weight: 600;

        color: #666;
      }

      .category-chips {
        display: flex;

        flex-wrap: wrap;

        gap: 5px;

        margin-top: 4px;
      }

      .category-chip {
        display: inline-block;

        padding: 4px 8px;

        border-radius: 5px;

        background: #e6eef8;

        color: #315b8a;

        font-size: 11px;

        line-height: 1.2;
      }

      /* =====================================================
       Tag chips
       ===================================================== */

      .tag-chips {
        display: flex;

        flex-wrap: wrap;

        gap: 5px;

        margin-top: 6px;
      }

      .tag-chip {
        display: inline-block;

        padding: 4px 8px;

        border-radius: 5px;

        background: #eeeeee;

        color: #555;

        font-size: 11px;

        line-height: 1.2;
      }

      /* =====================================================
       Dates
       ===================================================== */

      .product-dates {
        margin-top: 10px;
      }

      .product-dates .date {
        margin-top: 4px;

        font-size: 12px;

        line-height: 1.5;

        color: #777;
      }

      /* =====================================================
       Product link
       ===================================================== */

      .product-link {
        display: inline-block;

        margin-top: 12px;

        color: #06c;

        font-size: 13px;

        text-decoration: none;
      }

      .product-link:hover {
        text-decoration: underline;
      }

      /* =====================================================
       1-row view
       ===================================================== */

      .products.list-view {
        display: flex;

        flex-direction: column;

        gap: 8px;
      }

      .products.list-view .product {
        display: grid;

        /*
       * 画像
       * 商品名
       * SKU / カテゴリ / タグ
       * 価格
       * 作成日 / 更新日
       * 販売状態
       */

        grid-template-columns:
          80px
          minmax(170px, 1.4fr)
          minmax(240px, 2fr)
          minmax(90px, 0.7fr)
          minmax(170px, 1.2fr)
          85px;

        grid-template-areas:
          "image title meta price dates status"
          "image title meta price dates status"
          "image link  link link  link  status";

        align-items: center;

        column-gap: 15px;

        row-gap: 5px;

        padding: 10px 15px;

        border-radius: 8px;

        background: #fff;

        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);

        overflow: hidden;
      }

      .products.list-view .product-image {
        grid-area: image;

        width: 80px;

        height: 80px;

        aspect-ratio: 1 / 1;

        border-radius: 6px;

        object-fit: cover;

        background: #eee;
      }

      .products.list-view .product-body {
        display: contents;
      }

      /* -----------------------------------------------------
       1-row title
       ----------------------------------------------------- */

      .products.list-view .product-title {
        grid-area: title;

        min-width: 0;

        margin: 0;

        font-size: 14px;

        font-weight: 600;

        line-height: 1.4;

        overflow: hidden;

        display: -webkit-box;

        -webkit-line-clamp: 2;

        -webkit-box-orient: vertical;
      }

      /* -----------------------------------------------------
       1-row meta
       SKU / category / tags
       ----------------------------------------------------- */

      .products.list-view .product-meta {
        grid-area: meta;

        min-width: 0;

        overflow: hidden;
      }

      .products.list-view .product-meta .sku {
        margin: 0;

        font-size: 12px;

        line-height: 1.5;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
      }

      .products.list-view .product-meta .category-label {
        margin-top: 4px;

        font-size: 10px;
      }

      .products.list-view .product-meta .category-chips {
        display: flex;

        flex-wrap: wrap;

        gap: 4px;

        margin-top: 3px;

        max-height: 24px;

        overflow: hidden;
      }

      .products.list-view .product-meta .category-chip {
        padding: 3px 6px;

        font-size: 10px;

        white-space: nowrap;
      }

      .products.list-view .product-meta .tag-chips {
        display: flex;

        flex-wrap: wrap;

        gap: 4px;

        margin-top: 4px;

        max-height: 24px;

        overflow: hidden;
      }

      .products.list-view .product-meta .tag-chip {
        padding: 3px 6px;

        font-size: 10px;

        white-space: nowrap;
      }

      /* -----------------------------------------------------
       1-row price
       ----------------------------------------------------- */

      .products.list-view .product-price {
        grid-area: price;

        min-width: 0;

        margin: 0;

        font-size: 14px;

        font-weight: 700;

        white-space: nowrap;
      }

      /* -----------------------------------------------------
       1-row dates
       作成日 / 更新日を同じ列
       ----------------------------------------------------- */

      .products.list-view .product-dates {
        grid-area: dates;

        min-width: 0;

        margin: 0;
      }

      .products.list-view .product-dates .date {
        margin: 0;

        font-size: 11px;

        line-height: 1.7;

        white-space: nowrap;

        color: #777;
      }

      /* -----------------------------------------------------
       1-row availability
       常に右端
       ----------------------------------------------------- */

      .products.list-view .availability {
        grid-area: status;

        justify-self: end;

        align-self: center;

        margin: 0;

        padding: 5px 8px;

        white-space: nowrap;

        text-align: center;
      }

      /* -----------------------------------------------------
       1-row link
       ----------------------------------------------------- */

      .products.list-view .product-link {
        grid-area: link;

        margin: 0;

        font-size: 12px;

        white-space: nowrap;
      }

      /* =====================================================
       1-row : 1250px
       ===================================================== */

      @media (max-width: 1250px) {
        .products.list-view .product {
          grid-template-columns:
            70px
            minmax(150px, 1.2fr)
            minmax(210px, 1.8fr)
            90px
            145px
            80px;

          column-gap: 10px;

          padding: 10px;
        }

        .products.list-view .product-image {
          width: 70px;

          height: 70px;
        }

        .products.list-view .product-title {
          font-size: 13px;
        }

        .products.list-view .product-meta .sku {
          font-size: 11px;
        }

        .products.list-view .product-meta .category-chip,
        .products.list-view .product-meta .tag-chip {
          font-size: 9px;
        }

        .products.list-view .product-price {
          font-size: 13px;
        }

        .products.list-view .product-dates .date {
          font-size: 10px;
        }

        .products.list-view .availability {
          font-size: 10px;
        }
      }

      /* =====================================================
       Tablet : 1000px
       ===================================================== */

      @media (max-width: 1000px) {
        .products.list-view .product {
          grid-template-columns:
            70px
            minmax(160px, 1.3fr)
            minmax(200px, 1.7fr)
            90px
            80px;

          grid-template-areas:
            "image title meta price status"
            "image dates meta price status"
            "image link  link  link  link";

          column-gap: 10px;
        }

        .products.list-view .product-image {
          width: 70px;

          height: 70px;
        }

        .products.list-view .product-dates .date {
          font-size: 10px;
        }
      }

      /* =====================================================
       Tablet / small desktop : 800px
       ===================================================== */

      @media (max-width: 800px) {
        .products.list-view .product {
          grid-template-columns:
            65px
            minmax(140px, 1.2fr)
            minmax(180px, 1.8fr)
            80px
            75px;

          grid-template-areas:
            "image title meta price status"
            "image dates meta price status"
            "image link  link  link  link";

          column-gap: 8px;

          padding: 9px;
        }

        .products.list-view .product-image {
          width: 65px;

          height: 65px;
        }

        .products.list-view .product-title {
          font-size: 12px;
        }

        .products.list-view .product-meta .sku {
          font-size: 10px;
        }

        .products.list-view .product-meta .category-chip,
        .products.list-view .product-meta .tag-chip {
          padding: 3px 5px;

          font-size: 8px;
        }

        .products.list-view .product-price {
          font-size: 12px;
        }

        .products.list-view .product-dates .date {
          font-size: 9px;
        }

        .products.list-view .availability {
          padding: 4px 5px;

          font-size: 9px;
        }
      }

      /* =====================================================
       Large smartphone : 650px
       ===================================================== */

      @media (max-width: 650px) {
        .container {
          padding: 12px;
        }

        .main-controls {
          align-items: stretch;
        }

        .search-box {
          flex-basis: 100%;
        }

        .sort-box {
          width: auto;

          flex: 1;
        }

        .view-switch {
          flex: 0 0 auto;
        }

        .products.list-view .product {
          grid-template-columns:
            60px
            minmax(0, 1fr)
            auto;

          grid-template-areas:
            "image title status"
            "image meta  meta"
            "image price price"
            "image dates dates"
            "link  link  link";

          align-items: center;

          gap: 7px 9px;

          padding: 9px;
        }

        .products.list-view .product-image {
          width: 60px;

          height: 60px;
        }

        .products.list-view .product-title {
          align-self: center;

          font-size: 13px;
        }

        .products.list-view .product-meta {
          width: 100%;
        }

        .products.list-view .product-meta .sku {
          font-size: 11px;
        }

        .products.list-view .product-meta .category-label {
          font-size: 10px;
        }

        .products.list-view .product-meta .category-chips,
        .products.list-view .product-meta .tag-chips {
          max-height: none;
        }

        .products.list-view .product-meta .category-chip,
        .products.list-view .product-meta .tag-chip {
          padding: 3px 6px;

          font-size: 9px;
        }

        .products.list-view .product-price {
          font-size: 13px;
        }

        .products.list-view .product-dates {
          display: flex;

          flex-wrap: wrap;

          gap: 10px;
        }

        .products.list-view .product-dates .date {
          font-size: 10px;
        }

        .products.list-view .availability {
          justify-self: end;

          align-self: center;

          font-size: 10px;
        }

        .products.list-view .product-link {
          margin-top: 1px;

          font-size: 11px;
        }
      }

      /* =====================================================
       Smartphone : 480px
       ===================================================== */

      @media (max-width: 480px) {
        header {
          padding: 15px;
        }

        header h1 {
          font-size: 20px;
        }

        .container {
          padding: 10px;
        }

        .tabs {
          gap: 5px;

          margin-bottom: 15px;
        }

        .tab {
          padding: 8px 12px;

          font-size: 12px;
        }

        .sort-box {
          flex-basis: 100%;
        }

        .view-switch {
          width: 100%;
        }

        .view-button {
          flex: 1;
        }

        .products.list-view .product {
          grid-template-columns:
            55px
            minmax(0, 1fr)
            auto;

          grid-template-areas:
            "image title status"
            "image meta  meta"
            "image price price"
            "image dates dates"
            "link  link  link";

          gap: 6px 8px;

          padding: 8px;
        }

        .products.list-view .product-image {
          width: 55px;

          height: 55px;

          border-radius: 5px;
        }

        .products.list-view .product-title {
          font-size: 12px;
        }

        .products.list-view .product-meta .sku {
          font-size: 10px;
        }

        .products.list-view .product-meta .category-label {
          margin-top: 3px;

          font-size: 9px;
        }

        .products.list-view .product-meta .category-chips,
        .products.list-view .product-meta .tag-chips {
          gap: 3px;
        }

        .products.list-view .product-meta .category-chip,
        .products.list-view .product-meta .tag-chip {
          padding: 3px 5px;

          font-size: 8px;
        }

        .products.list-view .product-price {
          font-size: 12px;
        }

        .products.list-view .product-dates {
          display: block;
        }

        .products.list-view .product-dates .date {
          display: inline;

          margin-right: 8px;

          font-size: 9px;
        }

        .products.list-view .availability {
          padding: 4px 6px;

          font-size: 9px;
        }

        .products.list-view .product-link {
          font-size: 10px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>FINDME STORE Monitor</h1>

      <div id="lastUpdated">Loading...</div>
    </header>

    <div class="container">
      <!-- ===================================================
       Tabs
       =================================================== -->

      <div id="tabs" class="tabs"></div>

      <!-- ===================================================
       Error
       =================================================== -->

      <div id="error" class="error" style="display: none"></div>

      <!-- ===================================================
       Controls
       =================================================== -->

      <div id="controls" style="display: none">
        ```
        <div class="main-controls">
          <div class="search-box">
            <input
              id="search"
              type="search"
              placeholder="商品名・SKUを検索"
              autocomplete="off"
            />
          </div>

          <div class="sort-box">
            <select id="priceSort">
              <option value="default">指定の並び順</option>

              <option value="created_desc">作成日の降順</option>

              <option value="sku_desc">SKUの降順</option>

              <option value="sku_asc">SKUの昇順</option>

              <option value="price_asc">価格が安い順</option>

              <option value="price_desc">価格が高い順</option>

              <option value="created_asc">作成日の昇順</option>

              <option value="updated_desc">更新日の降順</option>

              <option value="updated_asc">更新日の昇順</option>
            </select>
          </div>

          <div class="view-switch">
            <button
              id="cardViewButton"
              class="view-button active"
              type="button"
            >
              パネル
            </button>

            <button id="listViewButton" class="view-button" type="button">
              1行
            </button>
          </div>
        </div>

        <!-- =================================================
     Filters
     ================================================= -->

        <div class="filter-panel">
          <div class="filter-section">
            <div class="filter-title">販売状態</div>

            <div id="availabilityFilters" class="filter-buttons"></div>
          </div>

          <div class="filter-section">
            <div class="filter-title">カテゴリ</div>

            <div id="categoryFilters" class="filter-buttons"></div>
          </div>

          <div class="filter-section">
            <div class="filter-title">タグ</div>

            <div id="tagFilters" class="filter-buttons"></div>
          </div>

          <button id="clearFilters" class="clear-filters" type="button">
            フィルターをクリア
          </button>
        </div>
        ```
      </div>

      <!-- ===================================================
       Status
       =================================================== -->

      <div id="status" class="status" style="display: none"></div>

      <!-- ===================================================
       Loading
       =================================================== -->

      <div id="loading" class="loading">データを読み込んでいます...</div>

      <!-- ===================================================
       Products
       =================================================== -->

      <div id="products" class="products"></div>
    </div>

    <script>
      "use strict";

      /* =========================================================
   State
   ========================================================= */

      let monitors = [];

      let currentMonitor = null;

      let originalProducts = [];

      let viewMode = "card";

      const selectedTags = new Set();

      const selectedCategories = new Set();

      const selectedAvailability = new Set();

      /* =========================================================
   DOM
   ========================================================= */

      const tabsEl = document.getElementById("tabs");

      const productsEl = document.getElementById("products");

      const loadingEl = document.getElementById("loading");

      const errorEl = document.getElementById("error");

      const statusEl = document.getElementById("status");

      const controlsEl = document.getElementById("controls");

      const searchEl = document.getElementById("search");

      const priceSortEl = document.getElementById("priceSort");

      const availabilityFiltersEl = document.getElementById(
        "availabilityFilters",
      );

      const categoryFiltersEl = document.getElementById("categoryFilters");

      const tagFiltersEl = document.getElementById("tagFilters");

      const clearFiltersEl = document.getElementById("clearFilters");

      const cardViewButton = document.getElementById("cardViewButton");

      const listViewButton = document.getElementById("listViewButton");

      const lastUpdatedEl = document.getElementById("lastUpdated");

      /* =========================================================
   Utility
   ========================================================= */

      function showError(message) {
        errorEl.textContent = message || "不明なエラー";

        errorEl.style.display = "block";
      }

      function clearError() {
        errorEl.textContent = "";

        errorEl.style.display = "none";
      }

      function escapeHtml(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")

          .replace(/</g, "&lt;")

          .replace(/>/g, "&gt;")

          .replace(/"/g, "&quot;")

          .replace(/'/g, "&#039;");
      }

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return date.toLocaleString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function timestamp(value) {
        if (!value) {
          return 0;
        }

        const time = new Date(value).getTime();

        return Number.isNaN(time) ? 0 : time;
      }

      function formatPrice(value) {
        if (value === null || value === undefined || value === "") {
          return "-";
        }

        const number = Number(value);

        if (Number.isNaN(number)) {
          return String(value);
        }

        return new Intl.NumberFormat("ja-JP").format(number) + "円";
      }

      /* =========================================================
   Monitor helpers
   ========================================================= */

      function getMonitorName(monitor) {
        return (
          monitor.name ||
          monitor.title ||
          monitor.collection ||
          monitor.slug ||
          "Monitor"
        );
      }

      function getMonitorCollection(monitor) {
        return monitor.collection || monitor.slug || monitor.name || "";
      }

      function getProductsPath(monitor) {
        /*
         * monitors.json に
         *
         * products_path
         *
         * が指定されていれば、それを優先
         */

        if (monitor.products_path) {
          return monitor.products_path;
        }

        const collection = getMonitorCollection(monitor);

        /*
         * デフォルト
         *
         * docs/data/{collection}/products.json
         */

        return "./data/" + encodeURIComponent(collection) + "/products.json";
      }

      /* =========================================================
   Load monitors.json
   ========================================================= */

      async function loadMonitors() {
        const response = await fetch("./monitors.json?t=" + Date.now(), {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(
            "monitors.json の取得に失敗しました: HTTP " + response.status,
          );
        }

        const data = await response.json();

        if (Array.isArray(data)) {
          monitors = data;
        } else if (data && Array.isArray(data.monitors)) {
          monitors = data.monitors;
        } else {
          throw new Error(
            "monitors.json の形式が正しくありません。\n" +
              '配列または { "monitors": [...] } が必要です。',
          );
        }

        if (monitors.length === 0) {
          throw new Error("monitors.json に監視対象がありません。");
        }
      }

      /* =========================================================
   Tabs
   ========================================================= */

      function renderTabs() {
        tabsEl.innerHTML = "";

        monitors.forEach((monitor, index) => {
          const button = document.createElement("button");

          button.type = "button";

          button.className = "tab";

          if (index === 0) {
            button.classList.add("active");
          }

          button.textContent = getMonitorName(monitor);

          button.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach((tab) => {
              tab.classList.remove("active");
            });

            button.classList.add("active");

            loadMonitor(monitor);
          });

          tabsEl.appendChild(button);
        });
      }

      /* =========================================================
   Load products.json
   ========================================================= */

      async function loadProducts(monitor) {
        const path = getProductsPath(monitor);

        const separator = path.includes("?") ? "&" : "?";

        const response = await fetch(path + separator + "t=" + Date.now(), {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(
            "products.json の取得に失敗しました: HTTP " +
              response.status +
              "\n" +
              path,
          );
        }

        const data = await response.json();

        /*
         * 形式1
         *
         * [
         *   {...},
         *   {...}
         * ]
         */

        if (Array.isArray(data)) {
          return data;
        }

        /*
         * 形式2
         *
         * {
         *   "products": [...]
         * }
         */

        if (data && Array.isArray(data.products)) {
          return data.products;
        }

        throw new Error("products.json の形式が正しくありません。\n" + path);
      }

      /* =========================================================
   Product helpers
   ========================================================= */

      function getVariant(product) {
        if (
          !product ||
          !Array.isArray(product.variants) ||
          product.variants.length === 0
        ) {
          return null;
        }

        return product.variants[0];
      }

      function getSku(product) {
        const variant = getVariant(product);

        return String(variant?.sku || product.sku || "");
      }

      function getPrice(product) {
        const variant = getVariant(product);

        const value = Number(variant?.price ?? product.price ?? 0);

        return Number.isNaN(value) ? 0 : value;
      }

      function getCreatedAt(product) {
        const variant = getVariant(product);

        return variant?.created_at || product.created_at || "";
      }

      function getUpdatedAt(product) {
        const variant = getVariant(product);

        return variant?.updated_at || product.updated_at || "";
      }

      function isAvailable(product) {
        if (Array.isArray(product.variants) && product.variants.length > 0) {
          return product.variants.some(
            (variant) => variant && variant.available === true,
          );
        }

        if (typeof product.available === "boolean") {
          return product.available;
        }

        return false;
      }

      function getImage(product) {
        if (Array.isArray(product.images) && product.images.length > 0) {
          const image = product.images[0];

          if (typeof image === "string") {
            return image;
          }

          if (image && typeof image === "object") {
            return image.src || image.url || "";
          }
        }

        if (typeof product.image === "string") {
          return product.image;
        }

        if (product.image && typeof product.image === "object") {
          return product.image.src || product.image.url || "";
        }

        return "";
      }

      function getProductUrl(product) {
        if (product.url) {
          return product.url;
        }

        if (product.handle) {
          return (
            "https://findmestore.thinkr.jp/products/" +
            encodeURIComponent(product.handle)
          );
        }

        return "";
      }

      function getTags(product) {
        if (Array.isArray(product.tags)) {
          return product.tags

            .map((tag) => String(tag).trim())

            .filter(Boolean);
        }

        if (typeof product.tags === "string") {
          return product.tags

            .split(",")

            .map((tag) => tag.trim())

            .filter(Boolean);
        }

        return [];
      }

      function getCategories(product) {
        /*
         * categoryを優先
         */

        const value =
          product.category ??
          product.categories ??
          product.product_type ??
          product.type ??
          "";

        if (Array.isArray(value)) {
          return value

            .map((item) => String(item).trim())

            .filter(Boolean);
        }

        if (typeof value === "string" && value.trim()) {
          return [value.trim()];
        }

        return [];
      }

      /* =========================================================
   Filter values
   ========================================================= */

      function collectFilterValues() {
        const tags = new Set();

        const categories = new Set();

        originalProducts.forEach((product) => {
          getTags(product).forEach((tag) => {
            tags.add(tag);
          });

          getCategories(product).forEach((category) => {
            categories.add(category);
          });
        });

        return {
          tags: Array.from(tags).sort((a, b) => a.localeCompare(b, "ja")),

          categories: Array.from(categories).sort((a, b) =>
            a.localeCompare(b, "ja"),
          ),
        };
      }

      /* =========================================================
   Filter button
   ========================================================= */

      function renderFilterButton(container, label, active, callback) {
        const button = document.createElement("button");

        button.type = "button";

        button.className = "filter-button";

        if (active) {
          button.classList.add("active");
        }

        button.textContent = label;

        button.addEventListener("click", callback);

        container.appendChild(button);
      }

      /* =========================================================
   Render filters
   ========================================================= */

      function renderFilters() {
        availabilityFiltersEl.innerHTML = "";

        categoryFiltersEl.innerHTML = "";

        tagFiltersEl.innerHTML = "";

        /* -------------------------------------------------------
     Availability
     ------------------------------------------------------- */

        renderFilterButton(
          availabilityFiltersEl,
          "販売中",
          selectedAvailability.has("available"),
          () => {
            if (selectedAvailability.has("available")) {
              selectedAvailability.delete("available");
            } else {
              selectedAvailability.add("available");
            }

            renderFilters();

            renderProducts();
          },
        );

        renderFilterButton(
          availabilityFiltersEl,
          "Sold out",
          selectedAvailability.has("soldout"),
          () => {
            if (selectedAvailability.has("soldout")) {
              selectedAvailability.delete("soldout");
            } else {
              selectedAvailability.add("soldout");
            }

            renderFilters();

            renderProducts();
          },
        );

        const values = collectFilterValues();

        /* -------------------------------------------------------
     Categories
     ------------------------------------------------------- */

        if (values.categories.length === 0) {
          const empty = document.createElement("span");

          empty.textContent = "カテゴリなし";

          empty.style.color = "#999";

          empty.style.fontSize = "12px";

          categoryFiltersEl.appendChild(empty);
        } else {
          values.categories.forEach((category) => {
            renderFilterButton(
              categoryFiltersEl,
              category,
              selectedCategories.has(category),
              () => {
                if (selectedCategories.has(category)) {
                  selectedCategories.delete(category);
                } else {
                  selectedCategories.add(category);
                }

                renderFilters();

                renderProducts();
              },
            );
          });
        }

        /* -------------------------------------------------------
     Tags
     ------------------------------------------------------- */

        if (values.tags.length === 0) {
          const empty = document.createElement("span");

          empty.textContent = "タグなし";

          empty.style.color = "#999";

          empty.style.fontSize = "12px";

          tagFiltersEl.appendChild(empty);
        } else {
          values.tags.forEach((tag) => {
            renderFilterButton(tagFiltersEl, tag, selectedTags.has(tag), () => {
              if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
              } else {
                selectedTags.add(tag);
              }

              renderFilters();

              renderProducts();
            });
          });
        }
      }

      /* =========================================================
   Match filters
   ========================================================= */

      function matchesFilter(product) {
        /* -------------------------------------------------------
     Search
     ------------------------------------------------------- */

        const keyword = searchEl.value.trim().toLowerCase();

        if (keyword) {
          const title = String(product.title || "").toLowerCase();

          const sku = getSku(product).toLowerCase();

          if (!title.includes(keyword) && !sku.includes(keyword)) {
            return false;
          }
        }

        /* -------------------------------------------------------
     Availability
     ------------------------------------------------------- */

        if (selectedAvailability.size > 0) {
          const key = isAvailable(product) ? "available" : "soldout";

          if (!selectedAvailability.has(key)) {
            return false;
          }
        }

        /* -------------------------------------------------------
     Category
     ------------------------------------------------------- */

        if (selectedCategories.size > 0) {
          const categories = getCategories(product);

          const matched = categories.some((category) =>
            selectedCategories.has(category),
          );

          if (!matched) {
            return false;
          }
        }

        /* -------------------------------------------------------
     Tags
     ------------------------------------------------------- */

        if (selectedTags.size > 0) {
          const tags = getTags(product);

          const matched = tags.some((tag) => selectedTags.has(tag));

          if (!matched) {
            return false;
          }
        }

        return true;
      }

      /* =========================================================
   Sorting
   ========================================================= */

      function sortProducts(products) {
        const sort = priceSortEl.value;

        /*
         * 指定の並び順
         *
         * products.jsonの順番を維持
         */

        if (sort === "default") {
          return products;
        }

        /* -------------------------------------------------------
     Created DESC
     ------------------------------------------------------- */

        if (sort === "created_desc") {
          products.sort(
            (a, b) => timestamp(getCreatedAt(b)) - timestamp(getCreatedAt(a)),
          );
        }

        /* -------------------------------------------------------
     SKU DESC
     ------------------------------------------------------- */

        if (sort === "sku_desc") {
          products.sort((a, b) =>
            getSku(b).localeCompare(getSku(a), "ja", {
              numeric: true,
              sensitivity: "base",
            }),
          );
        }

        /* -------------------------------------------------------
     SKU ASC
     ------------------------------------------------------- */

        if (sort === "sku_asc") {
          products.sort((a, b) =>
            getSku(a).localeCompare(getSku(b), "ja", {
              numeric: true,
              sensitivity: "base",
            }),
          );
        }

        /* -------------------------------------------------------
     Price ASC
     ------------------------------------------------------- */

        if (sort === "price_asc") {
          products.sort((a, b) => getPrice(a) - getPrice(b));
        }

        /* -------------------------------------------------------
     Price DESC
     ------------------------------------------------------- */

        if (sort === "price_desc") {
          products.sort((a, b) => getPrice(b) - getPrice(a));
        }

        /* -------------------------------------------------------
     Created ASC
     ------------------------------------------------------- */

        if (sort === "created_asc") {
          products.sort(
            (a, b) => timestamp(getCreatedAt(a)) - timestamp(getCreatedAt(b)),
          );
        }

        /* -------------------------------------------------------
     Updated DESC
     ------------------------------------------------------- */

        if (sort === "updated_desc") {
          products.sort(
            (a, b) => timestamp(getUpdatedAt(b)) - timestamp(getUpdatedAt(a)),
          );
        }

        /* -------------------------------------------------------
     Updated ASC
     ------------------------------------------------------- */

        if (sort === "updated_asc") {
          products.sort(
            (a, b) => timestamp(getUpdatedAt(a)) - timestamp(getUpdatedAt(b)),
          );
        }

        return products;
      }

      /* =========================================================
   Render products
   ========================================================= */

      function renderProducts() {
        productsEl.innerHTML = "";

        productsEl.classList.toggle("list-view", viewMode === "list");

        let products = originalProducts.filter(matchesFilter);

        /*
         * filter()でコピー済みなので
         * originalProductsは変更されない
         */

        products = sortProducts(products);

        if (products.length === 0) {
          productsEl.innerHTML =
            '<div class="loading">' + "該当する商品がありません。" + "</div>";

          updateStatus(0);

          return;
        }

        products.forEach((product) => {
          const card = document.createElement("div");

          card.className = "product";

          const image = getImage(product);

          const available = isAvailable(product);

          const sku = getSku(product);

          const price = getPrice(product);

          const createdAt = getCreatedAt(product);

          const updatedAt = getUpdatedAt(product);

          const categories = getCategories(product);

          const tags = getTags(product);

          const url = getProductUrl(product);

          /* ===================================================
         Image
         =================================================== */

          if (image) {
            const img = document.createElement("img");

            img.className = "product-image";

            img.src = image;

            img.alt = product.title || "";

            img.loading = "lazy";

            img.onerror = function () {
              this.style.visibility = "hidden";
            };

            card.appendChild(img);
          }

          /* ===================================================
         Body
         =================================================== */

          const body = document.createElement("div");

          body.className = "product-body";

          /* ===================================================
         Availability
         =================================================== */

          const availabilityEl = document.createElement("div");

          availabilityEl.className =
            "availability " + (available ? "available" : "soldout");

          availabilityEl.textContent = available ? "販売中" : "Sold out";

          body.appendChild(availabilityEl);

          /* ===================================================
         Title
         =================================================== */

          const titleEl = document.createElement("div");

          titleEl.className = "product-title";

          titleEl.textContent = product.title || "名称未設定";

          body.appendChild(titleEl);

          /* ===================================================
         Price
         =================================================== */

          const priceEl = document.createElement("div");

          priceEl.className = "product-price";

          priceEl.textContent = formatPrice(price);

          body.appendChild(priceEl);

          /* ===================================================
         SKU / Category / Tags
         同じ列
         =================================================== */

          const metaEl = document.createElement("div");

          metaEl.className = "product-meta";

          /* ---------------------------------------------------
         SKU
         --------------------------------------------------- */

          const skuEl = document.createElement("div");

          skuEl.className = "sku";

          skuEl.innerHTML = "<strong>SKU:</strong> " + escapeHtml(sku || "-");

          metaEl.appendChild(skuEl);

          /* ---------------------------------------------------
         Category label
         --------------------------------------------------- */

          const categoryLabel = document.createElement("div");

          categoryLabel.className = "category-label";

          categoryLabel.textContent = "";

          metaEl.appendChild(categoryLabel);

          /* ---------------------------------------------------
         Category chips
         --------------------------------------------------- */

          const categoryChips = document.createElement("div");

          categoryChips.className = "category-chips";

          if (categories.length > 0) {
            categories.forEach((category) => {
              const chip = document.createElement("span");

              chip.className = "category-chip";

              chip.textContent = category;

              categoryChips.appendChild(chip);
            });
          } else {
            const chip = document.createElement("span");

            chip.className = "category-chip";

            chip.textContent = "-";

            categoryChips.appendChild(chip);
          }

          metaEl.appendChild(categoryChips);

          /* ---------------------------------------------------
         Tag chips
         --------------------------------------------------- */

          const tagChips = document.createElement("div");

          tagChips.className = "tag-chips";

          tags.forEach((tag) => {
            const chip = document.createElement("span");

            chip.className = "tag-chip";

            chip.textContent = tag;

            tagChips.appendChild(chip);
          });

          metaEl.appendChild(tagChips);

          body.appendChild(metaEl);

          /* ===================================================
         Created / Updated
         同じ列
         =================================================== */

          const datesEl = document.createElement("div");

          datesEl.className = "product-dates";

          const createdEl = document.createElement("div");

          createdEl.className = "date";

          createdEl.innerHTML =
            "<strong>作成:</strong> " + escapeHtml(formatDate(createdAt));

          datesEl.appendChild(createdEl);

          const updatedEl = document.createElement("div");

          updatedEl.className = "date";

          updatedEl.innerHTML =
            "<strong>更新:</strong> " + escapeHtml(formatDate(updatedAt));

          datesEl.appendChild(updatedEl);

          body.appendChild(datesEl);

          /* ===================================================
         Product link
         =================================================== */

          if (url) {
            const link = document.createElement("a");

            link.className = "product-link";

            link.href = url;

            link.target = "_blank";

            link.rel = "noopener noreferrer";

            link.textContent = "商品ページ →";

            body.appendChild(link);
          }

          card.appendChild(body);

          productsEl.appendChild(card);
        });

        updateStatus(products.length);
      }

      /* =========================================================
   Status
   ========================================================= */

      function updateStatus(displayedCount) {
        const total = originalProducts.length;

        const available = originalProducts.filter((product) =>
          isAvailable(product),
        ).length;

        const soldout = total - available;

        statusEl.innerHTML =
          "<span>商品数: <strong>" +
          total +
          "</strong></span>" +
          "<span>表示中: <strong>" +
          displayedCount +
          "</strong></span>" +
          "<span>販売中: <strong>" +
          available +
          "</strong></span>" +
          "<span>Sold out: <strong>" +
          soldout +
          "</strong></span>";

        statusEl.style.display = "flex";
      }

      /* =========================================================
   Load monitor
   ========================================================= */

      async function loadMonitor(monitor) {
        currentMonitor = monitor;

        loadingEl.style.display = "block";

        productsEl.innerHTML = "";

        controlsEl.style.display = "none";

        statusEl.style.display = "none";

        clearError();

        /*
         * タブ切替時はフィルターをリセット
         */

        selectedTags.clear();

        selectedCategories.clear();

        selectedAvailability.clear();

        searchEl.value = "";

        priceSortEl.value = "default";

        try {
          const products = await loadProducts(monitor);

          originalProducts = Array.isArray(products) ? products : [];

          if (originalProducts.length === 0) {
            showError(
              "products.json は取得できましたが、商品が0件です。\n" +
                getProductsPath(monitor),
            );
          }

          renderFilters();

          controlsEl.style.display = "block";

          renderProducts();

          lastUpdatedEl.textContent =
            "監視対象: " +
            getMonitorName(monitor) +
            "　｜　最終読み込み: " +
            formatDate(new Date());
        } catch (error) {
          console.error(error);

          originalProducts = [];

          showError(error.message || "データの読み込みに失敗しました");
        } finally {
          loadingEl.style.display = "none";
        }
      }

      /* =========================================================
   View switch
   ========================================================= */

      cardViewButton.addEventListener("click", () => {
        viewMode = "card";

        cardViewButton.classList.add("active");

        listViewButton.classList.remove("active");

        renderProducts();
      });

      listViewButton.addEventListener("click", () => {
        viewMode = "list";

        listViewButton.classList.add("active");

        cardViewButton.classList.remove("active");

        renderProducts();
      });

      /* =========================================================
   Clear filters
   ========================================================= */

      clearFiltersEl.addEventListener("click", () => {
        selectedTags.clear();

        selectedCategories.clear();

        selectedAvailability.clear();

        searchEl.value = "";

        priceSortEl.value = "default";

        renderFilters();

        renderProducts();
      });

      /* =========================================================
   Search
   ========================================================= */

      searchEl.addEventListener("input", () => {
        renderProducts();
      });

      /* =========================================================
   Sort
   ========================================================= */

      priceSortEl.addEventListener("change", () => {
        renderProducts();
      });

      /* =========================================================
   Init
   ========================================================= */

      async function init() {
        try {
          await loadMonitors();

          renderTabs();

          await loadMonitor(monitors[0]);
        } catch (error) {
          console.error(error);

          loadingEl.style.display = "none";

          showError(error.message || "初期化に失敗しました");
        }
      }

      init();
    </script>
  </body>
</html>
