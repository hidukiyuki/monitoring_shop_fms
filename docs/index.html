<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FINDME STORE Monitor</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        color: #222;
      }

      header {
        background: #fff;
        border-bottom: 1px solid #ddd;
        padding: 24px;
      }

      .header-inner,
      .controls,
      main {
        max-width: 1400px;
        margin-left: auto;
        margin-right: auto;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      .info {
        color: #777;
        font-size: 13px;
      }

      .collection-tabs {
        max-width: 1400px;
        margin: 20px auto 0;
        padding: 0 20px;

        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .collection-tab {
        padding: 11px 20px;

        border: 1px solid #ccc;
        border-radius: 8px;

        background: #fff;
        color: #333;

        cursor: pointer;

        font-size: 14px;
        font-weight: 600;
      }

      .collection-tab.active {
        background: #222;
        color: #fff;
        border-color: #222;
      }

      .controls {
        padding: 15px 20px;
      }

      .search {
        width: 100%;
        padding: 14px 16px;

        border: 1px solid #ccc;
        border-radius: 8px;

        font-size: 16px;
      }

      .tabs,
      .filter-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .tab,
      .status-filter,
      .tag-filter {
        padding: 8px 13px;

        border: 1px solid #ccc;
        border-radius: 6px;

        background: #fff;
        cursor: pointer;
      }

      .tab.active,
      .status-filter.active,
      .tag-filter.active {
        background: #222;
        color: #fff;
      }

      select {
        padding: 8px 12px;

        border: 1px solid #ccc;
        border-radius: 6px;

        background: #fff;
      }

      main {
        padding: 0 20px 40px;
      }

      .count {
        margin-bottom: 10px;
        color: #777;
        font-size: 13px;
      }

      .products {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
      }

      .product {
        display: grid;

        grid-template-columns:
          120px
          minmax(200px, 1fr)
          150px
          120px;

        gap: 20px;

        align-items: center;

        padding: 16px;

        border-bottom: 1px solid #eee;
      }

      .product-image {
        width: 110px;
        height: 110px;

        object-fit: contain;

        background: #fafafa;

        border-radius: 6px;
      }

      .product-title {
        font-weight: 600;
        margin-bottom: 5px;
      }

      .product-title a {
        color: inherit;
        text-decoration: none;
      }

      .handle {
        font-size: 12px;
        color: #999;
        margin-bottom: 8px;
      }

      .product-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .tag {
        padding: 3px 7px;
        background: #eee;
        border-radius: 4px;
        font-size: 12px;
        color: #666;
      }

      .status {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 5px;
        font-size: 13px;
      }

      .available {
        background: #dff5df;
        color: #176b17;
      }

      .soldout {
        background: #eee;
        color: #777;
      }

      .hidden {
        background: #ffe0e0;
        color: #a00000;
      }

      .history-info {
        margin-top: 8px;
        color: #777;
        font-size: 12px;
        line-height: 1.7;
      }

      .loading,
      .no-results {
        padding: 60px 20px;
        text-align: center;
        color: #888;
      }

      @media (max-width: 800px) {
        .product {
          grid-template-columns: 80px 1fr;
        }

        .product-image {
          width: 75px;
          height: 75px;
        }

        .price,
        .status {
          grid-column: 2;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-inner">
        <h1>FINDME STORE Monitor</h1>

        <div class="info">
          <span id="collectionName"> - </span>

           |  最終取得: <span id="updated"> ------------------------- </span>

           |  履歴: <span id="total"> --------------------- </span>
          件
        </div>
      </div>
    </header>

    <div id="collectionTabs" class="collection-tabs"></div>

    <section class="controls">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="商品名・handle・タグで検索..."
      />

      <div class="tabs">
        <button class="tab active" data-mode="current">現在の商品</button>

        <button class="tab" data-mode="hidden">非表示商品</button>

        <button class="tab" data-mode="history">全履歴</button>
      </div>

      <div id="statusFilters" class="filter-row">
        <button class="status-filter active" data-status="all">すべて</button>

        <button class="status-filter" data-status="available">🟢 販売中</button>

        <button class="status-filter" data-status="soldout">🔴 Sold out</button>
      </div>

      <div id="tagFilters" class="filter-row"></div>

      <div class="filter-row">
        <select id="sort">
          <option value="default">デフォルト順</option>

          <option value="price-asc">価格が安い順</option>

          <option value="price-desc">価格が高い順</option>

          <option value="title-asc">商品名 A→Z</option>

          <option value="title-desc">商品名 Z→A</option>

          <option value="first-seen">初回確認が新しい順</option>

          <option value="last-seen">最終確認が新しい順</option>
        </select>
      </div>
    </section>

    <main>
      <div class="count">
        表示: <span id="visibleCount"> ---------------------------- </span>
        件
      </div>

      <div id="products" class="products">
        <div class="loading">読み込み中...</div>
      </div>
    </main>

    <script>
      let monitors = [];

      let selectedCollection = "";

      let history = [];

      let mode = "current";

      let statusFilter = "all";

      let tagFilter = "all";

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function loadConfig() {
        const response = await fetch("./monitors.json?" + Date.now());

        if (!response.ok) {
          throw new Error("monitors.jsonの取得に失敗しました");
        }

        const config = await response.json();

        if (!config.monitors || !Array.isArray(config.monitors)) {
          throw new Error("monitors.jsonの形式が不正です");
        }

        monitors = config.monitors;

        if (!monitors.length) {
          throw new Error("監視対象がありません");
        }

        selectedCollection = monitors[0].collection;

        renderCollectionTabs();

        await loadCollection(selectedCollection);
      }

      function renderCollectionTabs() {
        const container = document.getElementById("collectionTabs");

        container.innerHTML = "";

        monitors.forEach((monitor) => {
          const button = document.createElement("button");

          button.className = "collection-tab";

          if (monitor.collection === selectedCollection) {
            button.classList.add("active");
          }

          button.textContent = monitor.name;

          button.onclick = async () => {
            selectedCollection = monitor.collection;

            mode = "current";

            statusFilter = "all";

            tagFilter = "all";

            document.getElementById("search").value = "";

            document.getElementById("sort").value = "default";

            renderCollectionTabs();

            await loadCollection(selectedCollection);
          };

          container.appendChild(button);
        });
      }

      async function loadCollection(collection) {
        const productsUrl = `./data/${collection}/products.json?` + Date.now();

        const historyUrl = `./data/${collection}/history.json?` + Date.now();

        document.getElementById("products").innerHTML = `

            <div class="loading">
                読み込み中...
            </div>

        `;

        try {
          const [productsResponse, historyResponse] = await Promise.all([
            fetch(productsUrl),

            fetch(historyUrl),
          ]);

          if (!productsResponse.ok || !historyResponse.ok) {
            throw new Error("商品データの取得に失敗しました");
          }

          const productData = await productsResponse.json();

          const historyData = await historyResponse.json();

          history = Object.values(historyData.history || {});

          document.getElementById("collectionName").textContent =
            productData.name || collection;

          document.getElementById("updated").textContent = formatDate(
            productData.updated_at,
          );

          document.getElementById("total").textContent = history.length;

          buildTagFilters();

          updateModeButtons();

          render();
        } catch (error) {
          console.error(error);

          document.getElementById("products").innerHTML = `

                <div class="no-results">

                    データ取得エラー

                    <br><br>

                    ${escapeHtml(error.message)}

                </div>

            `;
        }
      }

      function getState(product) {
        return product.last || {};
      }

      function getPrice(product) {
        const price = getState(product).price;

        const value = Number(price);

        return Number.isFinite(value) ? value : null;
      }

      function isAvailable(product) {
        return getState(product).available === true;
      }

      function getTags(product) {
        return getState(product).tags || [];
      }

      function formatPrice(product) {
        const price = getPrice(product);

        if (price === null) {
          return "価格不明";
        }

        return price.toLocaleString("ja-JP") + " 円";
      }

      function buildTagFilters() {
        const tags = new Set();

        history.forEach((product) => {
          getTags(product).forEach((tag) => tags.add(tag));
        });

        const container = document.getElementById("tagFilters");

        container.innerHTML = "";

        const all = document.createElement("button");

        all.className = "tag-filter active";

        all.textContent = "全タグ";

        all.onclick = () => {
          tagFilter = "all";

          document
            .querySelectorAll(".tag-filter")
            .forEach((button) => button.classList.remove("active"));

          all.classList.add("active");

          render();
        };

        container.appendChild(all);

        [...tags]
          .sort((a, b) => a.localeCompare(b, "ja"))
          .forEach((tag) => {
            const button = document.createElement("button");

            button.className = "tag-filter";

            button.textContent = tag;

            button.onclick = () => {
              tagFilter = tag;

              document
                .querySelectorAll(".tag-filter")
                .forEach((button) => button.classList.remove("active"));

              button.classList.add("active");

              render();
            };

            container.appendChild(button);
          });
      }

      function matchesSearch(product, search) {
        if (!search) {
          return true;
        }

        const text = [product.title, product.handle, ...getTags(product)]
          .join(" ")
          .toLowerCase();

        return text.includes(search);
      }

      function filterProducts() {
        const search = document
          .getElementById("search")
          .value.trim()
          .toLowerCase();

        let result;

        if (mode === "current") {
          result = history.filter((product) => product.visible);
        } else if (mode === "hidden") {
          result = history.filter((product) => !product.visible);
        } else {
          result = [...history];
        }

        return result.filter((product) => {
          if (!matchesSearch(product, search)) {
            return false;
          }

          if (tagFilter !== "all" && !getTags(product).includes(tagFilter)) {
            return false;
          }

          if (mode === "current") {
            const available = isAvailable(product);

            if (statusFilter === "available" && !available) {
              return false;
            }

            if (statusFilter === "soldout" && available) {
              return false;
            }
          }

          return true;
        });
      }

      function sortProducts(items) {
        const sort = document.getElementById("sort").value;

        items.sort((a, b) => {
          if (sort === "price-asc") {
            return (getPrice(a) ?? Infinity) - (getPrice(b) ?? Infinity);
          }

          if (sort === "price-desc") {
            return (getPrice(b) ?? -Infinity) - (getPrice(a) ?? -Infinity);
          }

          if (sort === "title-asc") {
            return (a.title || "").localeCompare(b.title || "", "ja");
          }

          if (sort === "title-desc") {
            return (b.title || "").localeCompare(a.title || "", "ja");
          }

          if (sort === "first-seen") {
            return new Date(b.first_seen) - new Date(a.first_seen);
          }

          if (sort === "last-seen") {
            return new Date(b.last_seen) - new Date(a.last_seen);
          }

          return 0;
        });

        return items;
      }

      function render() {
        let items = filterProducts();

        items = sortProducts(items);

        document.getElementById("visibleCount").textContent = items.length;

        const container = document.getElementById("products");

        if (!items.length) {
          container.innerHTML = `

            <div class="no-results">
                条件に一致する商品がありません。
            </div>

        `;

          return;
        }

        container.innerHTML = items.map(renderProduct).join("");
      }

      function renderProduct(product) {
        const available = isAvailable(product);

        const tags = getTags(product)
          .map(
            (tag) =>
              `<span class="tag">
                    ${escapeHtml(tag)}
                </span>`,
          )
          .join("");

        const images = getState(product).images || [];

        const image = images[0] || "";

        let status;

        if (!product.visible) {
          status = `
            <span class="status hidden">
                ⚫ 非表示
            </span>
        `;
        } else if (available) {
          status = `
            <span class="status available">
                🟢 販売中
            </span>
        `;
        } else {
          status = `
            <span class="status soldout">
                🔴 Sold out
            </span>
        `;
        }

        return `

        <article class="product">

            <div>

                ${
                  image
                    ? `
                        <img
                            class="product-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(product.title)}"
                            loading="lazy"
                        >
                    `
                    : ""
                }

            </div>


            <div>

                <div class="product-title">

                    <a
                        href="${escapeHtml(product.url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        ${escapeHtml(product.title)}

                    </a>

                </div>


                <div class="handle">

                    ${escapeHtml(product.handle)}

                </div>


                <div class="product-tags">

                    ${tags}

                </div>


                ${
                  mode !== "current"
                    ? `
                        <div class="history-info">

                            初回:
                            ${formatDate(product.first_seen)}

                            <br>

                            最終:
                            ${formatDate(product.last_seen)}

                        </div>
                    `
                    : ""
                }

            </div>


            <div>

                ${formatPrice(product)}

            </div>


            <div>

                ${status}

            </div>


        </article>

    `;
      }

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return "-";
        }

        return date.toLocaleString("ja-JP");
      }

      function updateModeButtons() {
        document.querySelectorAll(".tab").forEach((button) => {
          button.classList.toggle("active", button.dataset.mode === mode);
        });

        document.getElementById("statusFilters").style.display =
          mode === "current" ? "flex" : "none";
      }

      document.getElementById("search").addEventListener("input", render);

      document.getElementById("sort").addEventListener("change", render);

      document.querySelectorAll(".tab").forEach((button) => {
        button.onclick = () => {
          mode = button.dataset.mode;

          updateModeButtons();

          render();
        };
      });

      document.querySelectorAll(".status-filter").forEach((button) => {
        button.onclick = () => {
          statusFilter = button.dataset.status;

          document
            .querySelectorAll(".status-filter")
            .forEach((b) => b.classList.remove("active"));

          button.classList.add("active");

          render();
        };
      });

      loadConfig().catch((error) => {
        console.error(error);

        document.getElementById("products").innerHTML = `

                    <div class="no-results">

                        ${escapeHtml(error.message)}

                    </div>

                `;
      });
    </script>
  </body>
</html>
