<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FINDME STORE Monitor</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #f5f5f5;
        color: #222;
      }

      /* =====================================================
       Header
       ===================================================== */

      header {
        background: #111;
        color: #fff;

        padding: 20px;
      }

      header h1 {
        margin: 0 0 8px;

        font-size: 24px;
      }

      #lastUpdated {
        font-size: 13px;

        opacity: 0.75;
      }

      .container {
        max-width: 1500px;

        margin: 0 auto;

        padding: 20px;
      }

      /* =====================================================
       Tabs
       ===================================================== */

      .tabs {
        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        margin-bottom: 20px;
      }

      .tab {
        border: 0;

        padding: 10px 18px;

        border-radius: 8px;

        background: #ddd;

        cursor: pointer;

        font-size: 14px;
      }

      .tab:hover {
        background: #ccc;
      }

      .tab.active {
        background: #111;

        color: #fff;
      }

      /* =====================================================
       Main controls
       ===================================================== */

      .main-controls {
        display: flex;

        gap: 10px;

        flex-wrap: wrap;

        margin-bottom: 15px;
      }

      .search-box {
        flex: 1 1 300px;
      }

      input,
      select {
        width: 100%;

        padding: 11px;

        border: 1px solid #ccc;

        border-radius: 7px;

        background: #fff;

        font-size: 14px;
      }

      .sort-box {
        width: 240px;
      }

      /* =====================================================
       View switch
       ===================================================== */

      .view-switch {
        display: flex;

        gap: 5px;

        background: #fff;

        padding: 4px;

        border: 1px solid #ddd;

        border-radius: 8px;
      }

      .view-button {
        border: 0;

        padding: 8px 12px;

        border-radius: 6px;

        background: transparent;

        cursor: pointer;

        font-size: 13px;
      }

      .view-button.active {
        background: #111;

        color: #fff;
      }

      /* =====================================================
       Filter panel
       ===================================================== */

      .filter-panel {
        background: #fff;

        padding: 15px;

        border-radius: 10px;

        margin-bottom: 20px;

        border: 1px solid #e5e5e5;
      }

      .filter-section {
        margin-bottom: 14px;
      }

      .filter-section:last-child {
        margin-bottom: 0;
      }

      .filter-title {
        font-size: 13px;

        font-weight: 700;

        margin-bottom: 8px;
      }

      .filter-buttons {
        display: flex;

        flex-wrap: wrap;

        gap: 6px;
      }

      .filter-button {
        border: 1px solid #ccc;

        background: #fff;

        color: #333;

        padding: 6px 10px;

        border-radius: 20px;

        cursor: pointer;

        font-size: 12px;

        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }

      .filter-button:hover {
        background: #eee;
      }

      .filter-button.active {
        background: #111;

        color: #fff;

        border-color: #111;
      }

      .clear-filters {
        border: 0;

        background: #eee;

        padding: 6px 10px;

        border-radius: 6px;

        cursor: pointer;

        font-size: 12px;

        margin-top: 5px;
      }

      .clear-filters:hover {
        background: #ddd;
      }

      /* =====================================================
       Status
       ===================================================== */

      .status {
        display: flex;

        flex-wrap: wrap;

        gap: 15px;

        margin-bottom: 20px;

        padding: 12px 15px;

        background: #fff;

        border-radius: 8px;

        font-size: 14px;
      }

      /* =====================================================
       Error
       ===================================================== */

      .error {
        padding: 15px;

        margin-bottom: 20px;

        background: #ffe5e5;

        border: 1px solid #ffb0b0;

        color: #b00000;

        border-radius: 8px;

        white-space: pre-wrap;
      }

      .loading {
        padding: 30px;

        text-align: center;

        color: #666;
      }

      /* =====================================================
       Card view
       ===================================================== */

      .products {
        display: grid;

        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

        gap: 20px;
      }

      .product {
        background: #fff;

        border-radius: 10px;

        overflow: hidden;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .product:hover {
        transform: translateY(-2px);

        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);
      }

      .product-image {
        width: 100%;

        aspect-ratio: 1 / 1;

        object-fit: cover;

        background: #eee;

        display: block;
      }

      .product-body {
        padding: 15px;
      }

      .product-title {
        font-size: 17px;

        font-weight: 600;

        margin-bottom: 8px;

        line-height: 1.4;
      }

      .product-price {
        font-size: 18px;

        font-weight: 700;

        margin-bottom: 10px;
      }

      .sku {
        font-size: 13px;

        color: #555;

        margin-bottom: 5px;
      }

      .date {
        font-size: 12px;

        color: #777;

        margin-top: 4px;
      }

      .tags {
        display: flex;

        flex-wrap: wrap;

        gap: 5px;

        margin-top: 10px;
      }

      .tag {
        padding: 4px 7px;

        background: #eee;

        border-radius: 5px;

        font-size: 11px;
      }

      /* =====================================================
       Availability
       ===================================================== */

      .availability {
        display: inline-block;

        padding: 5px 8px;

        border-radius: 5px;

        font-size: 12px;

        font-weight: 600;

        margin-bottom: 8px;
      }

      .available {
        background: #e5f7e5;

        color: #168316;
      }

      .soldout {
        background: #eee;

        color: #777;
      }

      .product-link {
        display: inline-block;

        margin-top: 12px;

        color: #0066cc;

        text-decoration: none;

        font-size: 13px;
      }

      .product-link:hover {
        text-decoration: underline;
      }

      /* =====================================================
       List view
       ===================================================== */

      .products.list-view {
        display: flex;

        flex-direction: column;

        gap: 8px;
      }

      .products.list-view .product {
        display: grid;

        grid-template-columns:
          80px
          minmax(180px, 2fr)
          minmax(110px, 1fr)
          minmax(100px, 1fr)
          minmax(160px, 1fr)
          minmax(160px, 1fr)
          auto;

        align-items: center;

        gap: 15px;

        padding: 10px 15px;

        border-radius: 8px;

        overflow: visible;

        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .products.list-view .product-image {
        width: 80px;

        height: 80px;

        aspect-ratio: 1 / 1;

        border-radius: 6px;

        object-fit: cover;
      }

      .products.list-view .product-body {
        display: contents;
      }

      .products.list-view .availability {
        margin: 0;
      }

      .products.list-view .product-title {
        margin: 0;

        font-size: 14px;
      }

      .products.list-view .product-price {
        margin: 0;

        font-size: 15px;
      }

      .products.list-view .sku {
        margin: 0;

        font-size: 12px;

        white-space: nowrap;
      }

      .products.list-view .date {
        margin: 0;

        font-size: 12px;

        color: #777;

        white-space: nowrap;
      }

      .products.list-view .tags {
        display: none;
      }

      .products.list-view .product-link {
        margin: 0;

        white-space: nowrap;
      }

      /* =====================================================
       Responsive
       ===================================================== */

      @media (max-width: 1200px) {
        .products.list-view .product {
          grid-template-columns:
            70px
            minmax(150px, 2fr)
            100px
            100px
            140px
            140px
            auto;
        }
      }

      @media (max-width: 1000px) {
        .products.list-view .product {
          grid-template-columns:
            70px
            1fr
            100px
            100px;
        }

        .products.list-view .date {
          grid-column: 2;
        }

        .products.list-view .product-link {
          grid-column: 3 / 5;
        }
      }

      @media (max-width: 700px) {
        .container {
          padding: 12px;
        }

        .products {
          grid-template-columns: 1fr;
        }

        .sort-box {
          width: 100%;
        }

        .view-switch {
          width: 100%;
        }

        .view-button {
          flex: 1;
        }

        .products.list-view .product {
          display: grid;

          grid-template-columns:
            60px
            1fr
            auto;

          gap: 10px;

          padding: 10px;
        }

        .products.list-view .product-image {
          width: 60px;

          height: 60px;
        }

        .products.list-view .product-title {
          grid-column: 2;
        }

        .products.list-view .product-price {
          grid-column: 2;
        }

        .products.list-view .sku {
          grid-column: 2;
        }

        .products.list-view .date {
          grid-column: 2;
        }

        .products.list-view .availability {
          grid-column: 3;

          grid-row: 1;
        }

        .products.list-view .product-link {
          grid-column: 3;

          grid-row: 2;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>FINDME STORE Monitor</h1>

      <div id="lastUpdated">Loading...</div>
    </header>

    <div class="container">
      <!-- ===================================================
       Tabs
       =================================================== -->

      <div id="tabs" class="tabs"></div>

      <!-- ===================================================
       Error
       =================================================== -->

      <div id="error" class="error" style="display: none"></div>

      <!-- ===================================================
       Controls
       =================================================== -->

      <div id="controls" style="display: none">
        ```
        <div class="main-controls">
          <!-- Search -->

          <div class="search-box">
            <input id="search" type="search" placeholder="商品名・SKUを検索" />
          </div>

          <!-- Sort -->

          <div class="sort-box">
            <select id="priceSort">
              <option value="default">指定の並び順</option>

              <option value="created_desc">作成日の降順</option>

              <option value="sku_desc">SKUの降順</option>

              <option value="sku_asc">SKUの昇順</option>

              <option value="price_asc">価格が安い順</option>

              <option value="price_desc">価格が高い順</option>

              <option value="created_asc">作成日の昇順</option>

              <option value="updated_desc">更新日の降順</option>

              <option value="updated_asc">更新日の昇順</option>
            </select>
          </div>

          <!-- View switch -->

          <div class="view-switch">
            <button
              id="cardViewButton"
              class="view-button active"
              type="button"
            >
              パネル
            </button>

            <button id="listViewButton" class="view-button" type="button">
              1行
            </button>
          </div>
        </div>

        <!-- =================================================
     Filters
     ================================================= -->

        <div class="filter-panel">
          <!-- Availability -->

          <div class="filter-section">
            <div class="filter-title">販売状態</div>

            <div id="availabilityFilters" class="filter-buttons"></div>
          </div>

          <!-- Category -->

          <div class="filter-section">
            <div class="filter-title">カテゴリ</div>

            <div id="categoryFilters" class="filter-buttons"></div>
          </div>

          <!-- Tags -->

          <div class="filter-section">
            <div class="filter-title">タグ</div>

            <div id="tagFilters" class="filter-buttons"></div>
          </div>

          <button id="clearFilters" class="clear-filters" type="button">
            フィルターをクリア
          </button>
        </div>
        ```
      </div>

      <!-- ===================================================
       Status
       =================================================== -->

      <div id="status" class="status" style="display: none"></div>

      <!-- ===================================================
       Loading
       =================================================== -->

      <div id="loading" class="loading">データを読み込んでいます...</div>

      <!-- ===================================================
       Products
       =================================================== -->

      <div id="products" class="products"></div>
    </div>

    <script>
      "use strict";

      /* =========================================================
   Global state
   ========================================================= */

      let monitors = [];

      let currentMonitor = null;

      let originalProducts = [];

      let viewMode = "card";

      let selectedTags = new Set();

      let selectedCategories = new Set();

      let selectedAvailability = new Set();

      /* =========================================================
   DOM
   ========================================================= */

      const tabsEl = document.getElementById("tabs");

      const productsEl = document.getElementById("products");

      const loadingEl = document.getElementById("loading");

      const errorEl = document.getElementById("error");

      const statusEl = document.getElementById("status");

      const controlsEl = document.getElementById("controls");

      const searchEl = document.getElementById("search");

      const priceSortEl = document.getElementById("priceSort");

      const availabilityFiltersEl = document.getElementById(
        "availabilityFilters",
      );

      const categoryFiltersEl = document.getElementById("categoryFilters");

      const tagFiltersEl = document.getElementById("tagFilters");

      const clearFiltersEl = document.getElementById("clearFilters");

      const cardViewButton = document.getElementById("cardViewButton");

      const listViewButton = document.getElementById("listViewButton");

      const lastUpdatedEl = document.getElementById("lastUpdated");

      /* =========================================================
   Utility
   ========================================================= */

      function showError(message) {
        errorEl.textContent = message || "不明なエラー";

        errorEl.style.display = "block";
      }

      function clearError() {
        errorEl.textContent = "";

        errorEl.style.display = "none";
      }

      function escapeHtml(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")

          .replace(/</g, "&lt;")

          .replace(/>/g, "&gt;")

          .replace(/"/g, "&quot;")

          .replace(/'/g, "&#039;");
      }

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return date.toLocaleString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function timestamp(value) {
        if (!value) {
          return 0;
        }

        const time = new Date(value).getTime();

        if (Number.isNaN(time)) {
          return 0;
        }

        return time;
      }

      function formatPrice(value) {
        const number = Number(value);

        if (Number.isNaN(number)) {
          return value || "-";
        }

        return new Intl.NumberFormat("ja-JP").format(number) + "円";
      }

      /* =========================================================
   Monitor config
   ========================================================= */

      async function loadMonitors() {
        const response = await fetch("./monitors.json?t=" + Date.now());

        if (!response.ok) {
          throw new Error(
            "monitors.json の取得に失敗しました: HTTP " + response.status,
          );
        }

        const data = await response.json();

        if (Array.isArray(data)) {
          monitors = data;
        } else if (data && Array.isArray(data.monitors)) {
          monitors = data.monitors;
        } else {
          throw new Error("monitors.json の形式が正しくありません");
        }

        if (monitors.length === 0) {
          throw new Error("監視対象がありません");
        }
      }

      /* =========================================================
   Monitor helpers
   ========================================================= */

      function getMonitorName(monitor) {
        return (
          monitor.name ||
          monitor.title ||
          monitor.collection ||
          monitor.slug ||
          "Monitor"
        );
      }

      function getMonitorCollection(monitor) {
        return monitor.collection || monitor.slug || monitor.name || "";
      }

      function getProductsPath(monitor) {
        if (monitor.products_path) {
          return monitor.products_path;
        }

        const collection = getMonitorCollection(monitor);

        return "./data/" + encodeURIComponent(collection) + "/products.json";
      }

      /* =========================================================
   Tabs
   ========================================================= */

      function renderTabs() {
        tabsEl.innerHTML = "";

        monitors.forEach((monitor, index) => {
          const button = document.createElement("button");

          button.type = "button";

          button.className = "tab" + (index === 0 ? " active" : "");

          button.textContent = getMonitorName(monitor);

          button.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach((tab) => {
              tab.classList.remove("active");
            });

            button.classList.add("active");

            loadMonitor(monitor);
          });

          tabsEl.appendChild(button);
        });
      }

      /* =========================================================
   Products JSON
   ========================================================= */

      async function loadProducts(monitor) {
        const path = getProductsPath(monitor);

        const separator = path.includes("?") ? "&" : "?";

        const response = await fetch(path + separator + "t=" + Date.now());

        if (!response.ok) {
          throw new Error(
            "products.json の取得に失敗しました: HTTP " + response.status,
          );
        }

        const data = await response.json();

        if (Array.isArray(data)) {
          return data;
        }

        if (data && Array.isArray(data.products)) {
          return data.products;
        }

        throw new Error("products.json の形式が正しくありません");
      }

      /* =========================================================
   Product helpers
   ========================================================= */

      function getVariant(product) {
        if (
          !product ||
          !Array.isArray(product.variants) ||
          product.variants.length === 0
        ) {
          return null;
        }

        return product.variants[0];
      }

      function getSku(product) {
        const variant = getVariant(product);

        return String(variant?.sku || product.sku || "");
      }

      function getPrice(product) {
        const variant = getVariant(product);

        const value = Number(variant?.price ?? product.price ?? 0);

        return Number.isNaN(value) ? 0 : value;
      }

      function isAvailable(product) {
        if (Array.isArray(product.variants) && product.variants.length > 0) {
          return product.variants.some(
            (variant) => variant && variant.available === true,
          );
        }

        if (typeof product.available === "boolean") {
          return product.available;
        }

        return false;
      }

      function getCreatedAt(product) {
        const variant = getVariant(product);

        return variant?.created_at || product.created_at || "";
      }

      function getUpdatedAt(product) {
        const variant = getVariant(product);

        return variant?.updated_at || product.updated_at || "";
      }

      function getImage(product) {
        if (Array.isArray(product.images) && product.images.length > 0) {
          const image = product.images[0];

          if (typeof image === "string") {
            return image;
          }

          if (image && typeof image === "object") {
            return image.src || image.url || "";
          }
        }

        if (typeof product.image === "string") {
          return product.image;
        }

        if (product.image && typeof product.image === "object") {
          return product.image.src || product.image.url || "";
        }

        return "";
      }

      function getProductUrl(product) {
        if (product.url) {
          return product.url;
        }

        if (product.handle) {
          return (
            "https://findmestore.thinkr.jp/products/" +
            encodeURIComponent(product.handle)
          );
        }

        return "";
      }

      function getTags(product) {
        if (Array.isArray(product.tags)) {
          return product.tags.map((tag) => String(tag).trim()).filter(Boolean);
        }

        if (typeof product.tags === "string") {
          return product.tags
            .split(",")
            .map((tag) => tag.trim())
            .filter(Boolean);
        }

        return [];
      }

      function getCategories(product) {
        const category =
          product.category || product.product_type || product.type || "";

        if (Array.isArray(category)) {
          return category.map((item) => String(item).trim()).filter(Boolean);
        }

        if (typeof category === "string" && category.trim()) {
          return [category.trim()];
        }

        return [];
      }

      /* =========================================================
   Collect filters
   ========================================================= */

      function collectFilterValues() {
        const tags = new Set();

        const categories = new Set();

        originalProducts.forEach((product) => {
          getTags(product).forEach((tag) => {
            tags.add(tag);
          });

          getCategories(product).forEach((category) => {
            categories.add(category);
          });
        });

        return {
          tags: Array.from(tags).sort((a, b) => a.localeCompare(b, "ja")),

          categories: Array.from(categories).sort((a, b) =>
            a.localeCompare(b, "ja"),
          ),
        };
      }

      /* =========================================================
   Filter button
   ========================================================= */

      function renderFilterButton(container, label, active, callback) {
        const button = document.createElement("button");

        button.type = "button";

        button.className = "filter-button" + (active ? " active" : "");

        button.textContent = label;

        button.addEventListener("click", callback);

        container.appendChild(button);
      }

      /* =========================================================
   Render filters
   ========================================================= */

      function renderFilters() {
        availabilityFiltersEl.innerHTML = "";

        categoryFiltersEl.innerHTML = "";

        tagFiltersEl.innerHTML = "";

        /* -------------------------------------------------------
     Availability
     ------------------------------------------------------- */

        renderFilterButton(
          availabilityFiltersEl,
          "販売中",
          selectedAvailability.has("available"),
          () => {
            if (selectedAvailability.has("available")) {
              selectedAvailability.delete("available");
            } else {
              selectedAvailability.add("available");
            }

            renderFilters();

            renderProducts();
          },
        );

        renderFilterButton(
          availabilityFiltersEl,
          "Sold out",
          selectedAvailability.has("soldout"),
          () => {
            if (selectedAvailability.has("soldout")) {
              selectedAvailability.delete("soldout");
            } else {
              selectedAvailability.add("soldout");
            }

            renderFilters();

            renderProducts();
          },
        );

        /* -------------------------------------------------------
     Categories
     ------------------------------------------------------- */

        const { categories, tags } = collectFilterValues();

        if (categories.length === 0) {
          const empty = document.createElement("span");

          empty.textContent = "カテゴリなし";

          empty.style.color = "#999";

          empty.style.fontSize = "12px";

          categoryFiltersEl.appendChild(empty);
        } else {
          categories.forEach((category) => {
            renderFilterButton(
              categoryFiltersEl,
              category,
              selectedCategories.has(category),
              () => {
                if (selectedCategories.has(category)) {
                  selectedCategories.delete(category);
                } else {
                  selectedCategories.add(category);
                }

                renderFilters();

                renderProducts();
              },
            );
          });
        }

        /* -------------------------------------------------------
     Tags
     ------------------------------------------------------- */

        if (tags.length === 0) {
          const empty = document.createElement("span");

          empty.textContent = "タグなし";

          empty.style.color = "#999";

          empty.style.fontSize = "12px";

          tagFiltersEl.appendChild(empty);
        } else {
          tags.forEach((tag) => {
            renderFilterButton(tagFiltersEl, tag, selectedTags.has(tag), () => {
              if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
              } else {
                selectedTags.add(tag);
              }

              renderFilters();

              renderProducts();
            });
          });
        }
      }

      /* =========================================================
   Filter matching
   ========================================================= */

      function matchesFilter(product) {
        /* -------------------------------------------------------
     Search
     ------------------------------------------------------- */

        const keyword = searchEl.value.trim().toLowerCase();

        if (keyword) {
          const title = String(product.title || "").toLowerCase();

          const sku = getSku(product).toLowerCase();

          if (!title.includes(keyword) && !sku.includes(keyword)) {
            return false;
          }
        }

        /* -------------------------------------------------------
     Availability
     ------------------------------------------------------- */

        if (selectedAvailability.size > 0) {
          const available = isAvailable(product);

          const key = available ? "available" : "soldout";

          if (!selectedAvailability.has(key)) {
            return false;
          }
        }

        /* -------------------------------------------------------
     Categories
     ------------------------------------------------------- */

        if (selectedCategories.size > 0) {
          const categories = getCategories(product);

          const matched = categories.some((category) =>
            selectedCategories.has(category),
          );

          if (!matched) {
            return false;
          }
        }

        /* -------------------------------------------------------
     Tags
     ------------------------------------------------------- */

        if (selectedTags.size > 0) {
          const tags = getTags(product);

          const matched = tags.some((tag) => selectedTags.has(tag));

          if (!matched) {
            return false;
          }
        }

        return true;
      }

      /* =========================================================
   Sorting
   ========================================================= */

      function sortProducts(products) {
        const sort = priceSortEl.value;

        /*
         * 指定の並び順
         *
         * JSONの並び順を維持
         */

        if (sort === "default") {
          return products;
        }

        /*
         * 作成日の降順
         */

        if (sort === "created_desc") {
          products.sort(
            (a, b) => timestamp(getCreatedAt(b)) - timestamp(getCreatedAt(a)),
          );
        }

        /*
         * SKUの降順
         */

        if (sort === "sku_desc") {
          products.sort((a, b) =>
            getSku(b).localeCompare(getSku(a), "ja", {
              numeric: true,
              sensitivity: "base",
            }),
          );
        }

        /*
         * SKUの昇順
         */

        if (sort === "sku_asc") {
          products.sort((a, b) =>
            getSku(a).localeCompare(getSku(b), "ja", {
              numeric: true,
              sensitivity: "base",
            }),
          );
        }

        /*
         * 価格の昇順
         */

        if (sort === "price_asc") {
          products.sort((a, b) => getPrice(a) - getPrice(b));
        }

        /*
         * 価格の降順
         */

        if (sort === "price_desc") {
          products.sort((a, b) => getPrice(b) - getPrice(a));
        }

        /*
         * 作成日の昇順
         */

        if (sort === "created_asc") {
          products.sort(
            (a, b) => timestamp(getCreatedAt(a)) - timestamp(getCreatedAt(b)),
          );
        }

        /*
         * 更新日の降順
         */

        if (sort === "updated_desc") {
          products.sort(
            (a, b) => timestamp(getUpdatedAt(b)) - timestamp(getUpdatedAt(a)),
          );
        }

        /*
         * 更新日の昇順
         */

        if (sort === "updated_asc") {
          products.sort(
            (a, b) => timestamp(getUpdatedAt(a)) - timestamp(getUpdatedAt(b)),
          );
        }

        return products;
      }

      /* =========================================================
   Render products
   ========================================================= */

      function renderProducts() {
        productsEl.innerHTML = "";

        productsEl.classList.toggle("list-view", viewMode === "list");

        let products = originalProducts.filter(matchesFilter);

        /*
         * filter() で作った配列を
         * sortするので元データは変更しない
         */

        products = sortProducts(products);

        if (products.length === 0) {
          productsEl.innerHTML =
            '<div class="loading">' + "該当する商品がありません。" + "</div>";

          updateStatus(0);

          return;
        }

        products.forEach((product) => {
          const card = document.createElement("div");

          card.className = "product";

          const image = getImage(product);

          const available = isAvailable(product);

          const sku = getSku(product);

          const price = getPrice(product);

          const createdAt = getCreatedAt(product);

          const updatedAt = getUpdatedAt(product);

          const url = getProductUrl(product);

          const tags = getTags(product);

          /* ---------------------------------------------------
         Image
         --------------------------------------------------- */

          if (image) {
            const img = document.createElement("img");

            img.className = "product-image";

            img.src = image;

            img.alt = product.title || "";

            img.loading = "lazy";

            img.onerror = function () {
              this.style.display = "none";
            };

            card.appendChild(img);
          }

          /* ---------------------------------------------------
         Body
         --------------------------------------------------- */

          const body = document.createElement("div");

          body.className = "product-body";

          /* ---------------------------------------------------
         Availability
         --------------------------------------------------- */

          const availabilityEl = document.createElement("div");

          availabilityEl.className =
            "availability " + (available ? "available" : "soldout");

          availabilityEl.textContent = available ? "販売中" : "Sold out";

          body.appendChild(availabilityEl);

          /* ---------------------------------------------------
         Title
         --------------------------------------------------- */

          const titleEl = document.createElement("div");

          titleEl.className = "product-title";

          titleEl.textContent = product.title || "名称未設定";

          body.appendChild(titleEl);

          /* ---------------------------------------------------
         Price
         --------------------------------------------------- */

          const priceEl = document.createElement("div");

          priceEl.className = "product-price";

          priceEl.textContent = formatPrice(price);

          body.appendChild(priceEl);

          /* ---------------------------------------------------
         SKU
         --------------------------------------------------- */

          const skuEl = document.createElement("div");

          skuEl.className = "sku";

          skuEl.innerHTML = "<strong>SKU:</strong> " + escapeHtml(sku || "-");

          body.appendChild(skuEl);

          /* ---------------------------------------------------
         Created
         --------------------------------------------------- */

          const createdEl = document.createElement("div");

          createdEl.className = "date";

          createdEl.innerHTML =
            "<strong>作成:</strong> " + escapeHtml(formatDate(createdAt));

          body.appendChild(createdEl);

          /* ---------------------------------------------------
         Updated
         --------------------------------------------------- */

          const updatedEl = document.createElement("div");

          updatedEl.className = "date";

          updatedEl.innerHTML =
            "<strong>更新:</strong> " + escapeHtml(formatDate(updatedAt));

          body.appendChild(updatedEl);

          /* ---------------------------------------------------
         Tags
         --------------------------------------------------- */

          if (tags.length > 0) {
            const tagsEl = document.createElement("div");

            tagsEl.className = "tags";

            tags.forEach((tag) => {
              const tagEl = document.createElement("span");

              tagEl.className = "tag";

              tagEl.textContent = tag;

              tagsEl.appendChild(tagEl);
            });

            body.appendChild(tagsEl);
          }

          /* ---------------------------------------------------
         Product link
         --------------------------------------------------- */

          if (url) {
            const link = document.createElement("a");

            link.className = "product-link";

            link.href = url;

            link.target = "_blank";

            link.rel = "noopener noreferrer";

            link.textContent = "商品ページ →";

            body.appendChild(link);
          }

          card.appendChild(body);

          productsEl.appendChild(card);
        });

        updateStatus(products.length);
      }

      /* =========================================================
   Status
   ========================================================= */

      function updateStatus(displayedCount) {
        const total = originalProducts.length;

        const available = originalProducts.filter((product) =>
          isAvailable(product),
        ).length;

        const soldout = total - available;

        statusEl.innerHTML =
          "<span>商品数: <strong>" +
          total +
          "</strong></span>" +
          "<span>表示中: <strong>" +
          displayedCount +
          "</strong></span>" +
          "<span>販売中: <strong>" +
          available +
          "</strong></span>" +
          "<span>Sold out: <strong>" +
          soldout +
          "</strong></span>";

        statusEl.style.display = "flex";
      }

      /* =========================================================
   Load monitor
   ========================================================= */

      async function loadMonitor(monitor) {
        currentMonitor = monitor;

        loadingEl.style.display = "block";

        productsEl.innerHTML = "";

        controlsEl.style.display = "none";

        statusEl.style.display = "none";

        clearError();

        /*
         * タブ切替時はフィルターをリセット
         */

        selectedTags.clear();

        selectedCategories.clear();

        selectedAvailability.clear();

        searchEl.value = "";

        priceSortEl.value = "default";

        try {
          const products = await loadProducts(monitor);

          originalProducts = Array.isArray(products) ? products : [];

          renderFilters();

          controlsEl.style.display = "block";

          renderProducts();

          lastUpdatedEl.textContent = "最終読み込み: " + formatDate(new Date());
        } catch (error) {
          console.error(error);

          originalProducts = [];

          showError(error.message || "データの読み込みに失敗しました");
        } finally {
          loadingEl.style.display = "none";
        }
      }

      /* =========================================================
   View switch
   ========================================================= */

      cardViewButton.addEventListener("click", () => {
        viewMode = "card";

        cardViewButton.classList.add("active");

        listViewButton.classList.remove("active");

        renderProducts();
      });

      listViewButton.addEventListener("click", () => {
        viewMode = "list";

        listViewButton.classList.add("active");

        cardViewButton.classList.remove("active");

        renderProducts();
      });

      /* =========================================================
   Clear filters
   ========================================================= */

      clearFiltersEl.addEventListener("click", () => {
        selectedTags.clear();

        selectedCategories.clear();

        selectedAvailability.clear();

        searchEl.value = "";

        priceSortEl.value = "default";

        renderFilters();

        renderProducts();
      });

      /* =========================================================
   Search
   ========================================================= */

      searchEl.addEventListener("input", () => {
        renderProducts();
      });

      /* =========================================================
   Sort
   ========================================================= */

      priceSortEl.addEventListener("change", () => {
        renderProducts();
      });

      /* =========================================================
   Initial
   ========================================================= */

      async function init() {
        try {
          await loadMonitors();

          renderTabs();

          await loadMonitor(monitors[0]);
        } catch (error) {
          console.error(error);

          loadingEl.style.display = "none";

          showError(error.message || "初期化に失敗しました");
        }
      }

      init();
    </script>
  </body>
</html>
