<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINDME STORE / ヰ世界情緒</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f5f5;
    color: #222;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 24px;
}

.header-inner {
    max-width: 1400px;
    margin: auto;
}

h1 {
    margin: 0 0 8px;
    font-size: 24px;
}

.info {
    color: #777;
    font-size: 14px;
}

.controls {
    max-width: 1400px;
    margin: 20px auto;
    padding: 0 20px;
}

.search {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.filter-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button,
select {
    padding: 9px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    cursor: pointer;
}

button.active {
    background: #222;
    color: white;
}

select {
    font-size: 14px;
}

.tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.tag {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    background: #eee;
}

main {
    max-width: 1400px;
    margin: auto;
    padding: 0 20px 40px;
}

.count {
    color: #777;
    margin-bottom: 10px;
}

.products {
    background: white;
    border-radius: 8px;
    overflow: hidden;
}

.product {
    display: grid;
    grid-template-columns: 120px 1fr 150px 120px;
    gap: 20px;
    align-items: center;

    padding: 16px;

    border-bottom: 1px solid #eee;
}

.product:last-child {
    border-bottom: none;
}

.product-image {
    width: 110px;
    height: 110px;
    object-fit: contain;
    background: #fafafa;
    border-radius: 6px;
}

.product-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
}

.product-title a {
    color: inherit;
    text-decoration: none;
}

.product-title a:hover {
    text-decoration: underline;
}

.handle {
    font-size: 12px;
    color: #999;
    margin-bottom: 8px;
}

.price {
    font-size: 16px;
    font-weight: 600;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 13px;
    white-space: nowrap;
}

.available {
    background: #dff5df;
    color: #176b17;
}

.soldout {
    background: #eee;
    color: #777;
}

.tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.product-tags {
    margin-top: 6px;
}

.no-results {
    padding: 50px;
    text-align: center;
    color: #888;
}

@media (max-width: 800px) {

    header {
        padding: 18px;
    }

    .controls,
    main {
        padding-left: 10px;
        padding-right: 10px;
    }

    .product {
        grid-template-columns: 80px 1fr;
        gap: 12px;
    }

    .product-image {
        width: 75px;
        height: 75px;
    }

    .price,
    .status {
        grid-column: 2;
    }
}
</style>

</head>

<body>

<header>
    <div class="header-inner">
        <h1>FINDME STORE / ヰ世界情緒</h1>

        <div class="info">
            最終更新:
            <span id="updated">読み込み中...</span>
           　
            商品数:
            <span id="total">-</span>
        </div>
    </div>
</header>

<section class="controls">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="商品名・handle・タグで検索..."
    >

    <div class="filter-row">

        <button
            class="status-filter active"
            data-status="all"
        >
            すべて
        </button>

        <button
            class="status-filter"
            data-status="available"
        >
            🟢 販売中
        </button>

        <button
            class="status-filter"
            data-status="soldout"
        >
            🔴 Sold out
        </button>

        <select id="sort">
            <option value="default">
                デフォルト順
            </option>

            <option value="price-asc">
                価格が安い順
            </option>

            <option value="price-desc">
                価格が高い順
            </option>

            <option value="title-asc">
                商品名 A→Z
            </option>

            <option value="title-desc">
                商品名 Z→A
            </option>
        </select>

    </div>

    <div id="tagFilters" class="filter-row"></div>

</section>

<main>

    <div class="count">
        表示:
        <span id="visibleCount">-</span>
        商品
    </div>

    <div id="products" class="products"></div>

</main>

<script>

let allProducts = [];
let currentStatus = "all";
let currentTag = "all";

async function loadProducts() {

    try {

        const response = await fetch(
            "../data/products.json?" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        allProducts = Object.values(data);

        document.getElementById("total")
            .textContent = allProducts.length;

        document.getElementById("updated")
            .textContent = new Date()
            .toLocaleString("ja-JP");

        buildTagFilters();

        render();

    } catch (error) {

        document.getElementById("products")
            .innerHTML = `
                <div class="no-results">
                    商品データの読み込みに失敗しました。
                    <br>
                    ${escapeHtml(error.message)}
                </div>
            `;
    }
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function buildTagFilters() {

    const tags = new Set();

    allProducts.forEach(product => {

        (product.tags || []).forEach(tag => {
            tags.add(tag);
        });

    });

    const container =
        document.getElementById("tagFilters");

    container.innerHTML = "";

    const allButton =
        document.createElement("button");

    allButton.textContent = "全タグ";

    allButton.classList.add("active");

    allButton.onclick = () => {

        currentTag = "all";

        document
            .querySelectorAll("#tagFilters button")
            .forEach(button =>
                button.classList.remove("active")
            );

        allButton.classList.add("active");

        render();
    };

    container.appendChild(allButton);

    [...tags]
        .sort((a, b) => a.localeCompare(b))
        .forEach(tag => {

            const button =
                document.createElement("button");

            button.textContent = tag;

            button.onclick = () => {

                currentTag = tag;

                document
                    .querySelectorAll("#tagFilters button")
                    .forEach(button =>
                        button.classList.remove("active")
                    );

                button.classList.add("active");

                render();
            };

            container.appendChild(button);
        });
}


function isAvailable(product) {

    return (product.variants || [])
        .some(variant =>
            variant.available === true
        );
}


function getPrice(product) {

    const prices = (product.variants || [])
        .map(variant =>
            Number(variant.price)
        )
        .filter(price =>
            Number.isFinite(price)
        );

    if (!prices.length) {
        return null;
    }

    return Math.min(...prices);
}


function formatPrice(product) {

    const price = getPrice(product);

    if (price === null) {
        return "価格不明";
    }

    return price.toLocaleString("ja-JP") + " 円";
}


function render() {

    const search =
        document.getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const sort =
        document.getElementById("sort")
            .value;

    let products =
        [...allProducts];

    products = products.filter(product => {

        const available =
            isAvailable(product);

        if (
            currentStatus === "available"
            && !available
        ) {
            return false;
        }

        if (
            currentStatus === "soldout"
            && available
        ) {
            return false;
        }

        if (
            currentTag !== "all"
            && !(product.tags || [])
                .includes(currentTag)
        ) {
            return false;
        }

        if (search) {

            const text = [
                product.title,
                product.handle,
                ...(product.tags || [])
            ]
            .join(" ")
            .toLowerCase();

            if (!text.includes(search)) {
                return false;
            }
        }

        return true;
    });


    products.sort((a, b) => {

        if (sort === "price-asc") {

            return (
                (getPrice(a) ?? Infinity)
                -
                (getPrice(b) ?? Infinity)
            );
        }

        if (sort === "price-desc") {

            return (
                (getPrice(b) ?? -Infinity)
                -
                (getPrice(a) ?? -Infinity)
            );
        }

        if (sort === "title-asc") {

            return (a.title || "")
                .localeCompare(
                    b.title || "",
                    "ja"
                );
        }

        if (sort === "title-desc") {

            return (b.title || "")
                .localeCompare(
                    a.title || "",
                    "ja"
                );
        }

        return 0;
    });


    document.getElementById("visibleCount")
        .textContent = products.length;


    const container =
        document.getElementById("products");

    if (!products.length) {

        container.innerHTML = `
            <div class="no-results">
                条件に一致する商品がありません。
            </div>
        `;

        return;
    }


    container.innerHTML =
        products.map(product => {

            const available =
                isAvailable(product);

            const image =
                product.images &&
                product.images.length
                    ? product.images[0]
                    : "";

            const tags =
                (product.tags || [])
                    .map(tag =>
                        `<span class="tag">
                            ${escapeHtml(tag)}
                        </span>`
                    )
                    .join("");


            return `
                <article class="product">

                    <div>
                        ${
                            image
                            ? `
                            <img
                                class="product-image"
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(product.title)}"
                                loading="lazy"
                            >
                            `
                            : ""
                        }
                    </div>

                    <div>

                        <div class="product-title">

                            <a
                                href="${escapeHtml(product.url)}"
                                target="_blank"
                                rel="noopener"
                            >
                                ${escapeHtml(product.title)}
                            </a>

                        </div>

                        <div class="handle">
                            ${escapeHtml(product.handle)}
                        </div>

                        <div class="product-tags tags">
                            ${tags}
                        </div>

                    </div>

                    <div class="price">
                        ${formatPrice(product)}
                    </div>

                    <div>
                        <span class="
                            status
                            ${available
                                ? "available"
                                : "soldout"}
                        ">
                            ${
                                available
                                ? "🟢 販売中"
                                : "🔴 Sold out"
                            }
                        </span>
                    </div>

                </article>
            `;

        }).join("");
}


document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


document
    .getElementById("sort")
    .addEventListener(
        "change",
        render
    );


document
    .querySelectorAll(".status-filter")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                currentStatus =
                    button.dataset.status;

                document
                    .querySelectorAll(".status-filter")
                    .forEach(button =>
                        button.classList.remove("active")
                    );

                button.classList.add("active");

                render();
            }
        );

    });


loadProducts();

</script>

</body>
</html>
