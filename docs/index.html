<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />

    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet" />

    <title>商品監視</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
          sans-serif;
        background: #f5f6f8;
        color: #222;
      }

      body {
        min-height: 100vh;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
      }

      .container {
        width: min(1500px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 60px;
      }

      header {
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 800;
      }

      .subtitle {
        color: #777;
        font-size: 13px;
      }

      /* -------------------------
       Tabs
    ------------------------- */

      .tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 16px;
      }

      .tab {
        flex: 0 0 auto;
        border: 1px solid #ddd;
        background: #fff;
        border-radius: 10px;
        padding: 10px 16px;
        color: #555;
        transition: 0.15s;
      }

      .tab:hover {
        border-color: #aaa;
      }

      .tab.active {
        background: #222;
        color: #fff;
        border-color: #222;
      }

      /* -------------------------
       Controls
    ------------------------- */

      .controls {
        background: #fff;
        border: 1px solid #e2e2e2;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }

      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .search {
        flex: 1 1 280px;
      }

      .search input {
        width: 100%;
        border: 1px solid #d7d7d7;
        border-radius: 9px;
        padding: 10px 12px;
        outline: none;
        background: #fff;
      }

      .search input:focus {
        border-color: #888;
      }

      .select {
        border: 1px solid #d7d7d7;
        background: #fff;
        border-radius: 9px;
        padding: 10px 12px;
        min-width: 180px;
      }

      .view-buttons {
        display: flex;
        gap: 6px;
      }

      .view-button {
        border: 1px solid #ddd;
        background: #fff;
        border-radius: 8px;
        padding: 9px 12px;
      }

      .view-button.active {
        background: #222;
        color: #fff;
        border-color: #222;
      }

      /* -------------------------
       Toggle filters
    ------------------------- */

      .filter-section {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid #eee;
      }

      .filter-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #555;
      }

      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .filter-button {
        border: 1px solid #ddd;
        background: #fff;
        color: #555;
        border-radius: 999px;
        padding: 6px 11px;
        font-size: 12px;
        transition: 0.15s;
      }

      .filter-button.active {
        background: #222;
        color: #fff;
        border-color: #222;
      }

      .filter-button.off {
        opacity: 0.45;
      }

      .status-buttons {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }

      .status-button {
        border: 1px solid #ddd;
        background: #fff;
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 12px;
      }

      .status-button.active {
        background: #222;
        color: #fff;
        border-color: #222;
      }

      /* -------------------------
       Info
    ------------------------- */

      .info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        color: #777;
        font-size: 12px;
      }

      .error {
        background: #fff1f1;
        color: #b00020;
        border: 1px solid #f1caca;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
        display: none;
        white-space: pre-wrap;
      }

      .loading {
        padding: 40px 0;
        text-align: center;
        color: #888;
      }

      /* -------------------------
       Product panel
    ------------------------- */

      .products.panel {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 16px;
      }

      .product-card {
        background: #fff;
        border: 1px solid #e3e3e3;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .product-image {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        background: #f0f0f0;
      }

      .product-image.no-image {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
        font-size: 13px;
      }

      .product-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        min-width: 0;
        flex: 1;
      }

      .product-title {
        font-weight: 700;
        font-size: 15px;
        line-height: 1.5;
        word-break: break-word;
      }

      .product-title a {
        text-decoration: none;
      }

      .product-title a:hover {
        text-decoration: underline;
      }

      .sku {
        color: #666;
        font-size: 12px;
        word-break: break-all;
      }

      .price {
        font-weight: 800;
        font-size: 17px;
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 5px;
        padding: 3px 7px;
        font-size: 11px;
        line-height: 1.4;
        white-space: nowrap;
      }

      /* カテゴリはタグと別色 */
      .badge.category {
        background: #e8f1ff;
        color: #2863b5;
        border: 1px solid #c8dcfb;
      }

      .badge.tag {
        background: #f4eafa;
        color: #7b3fa1;
        border: 1px solid #e0c9ee;
      }

      .badge.manual {
        background: #fff3d9;
        color: #9a6500;
        border: 1px solid #f0d99d;
      }

      .status {
        font-size: 12px;
        font-weight: 700;
      }

      .status.available {
        color: #16834b;
      }

      .status.soldout {
        color: #999;
      }

      .dates {
        color: #888;
        font-size: 11px;
        line-height: 1.6;
      }

      .source {
        color: #999;
        font-size: 11px;
      }

      /* -------------------------
       One-line view
    ------------------------- */

      .products.list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .list-row {
        display: grid;
        grid-template-columns:
          minmax(0, 2fr)
          minmax(170px, 1.3fr)
          minmax(100px, 0.8fr)
          minmax(210px, 1.4fr)
          minmax(90px, 0.6fr);
        gap: 12px;
        align-items: center;

        background: #fff;
        border: 1px solid #e4e4e4;
        border-radius: 10px;
        padding: 10px 12px;
        min-width: 0;
      }

      .list-main {
        min-width: 0;
      }

      .list-title {
        font-weight: 700;
        font-size: 13px;
        line-height: 1.4;
        word-break: break-word;
      }

      .list-title a {
        text-decoration: none;
      }

      .list-title a:hover {
        text-decoration: underline;
      }

      .list-meta {
        color: #777;
        font-size: 11px;
        margin-top: 3px;
        word-break: break-all;
      }

      .list-sku-tags {
        min-width: 0;
      }

      .list-sku {
        font-size: 11px;
        color: #555;
        word-break: break-all;
        margin-bottom: 5px;
      }

      .list-dates {
        font-size: 11px;
        color: #777;
        line-height: 1.5;
      }

      .list-price {
        font-weight: 800;
        font-size: 13px;
      }

      .list-status {
        text-align: right;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 700;
      }

      /* -------------------------
       Empty
    ------------------------- */

      .empty {
        background: #fff;
        border: 1px solid #e4e4e4;
        border-radius: 12px;
        padding: 40px 20px;
        text-align: center;
        color: #888;
      }

      /* -------------------------
       Footer
    ------------------------- */

      footer {
        margin-top: 30px;
        text-align: center;
        color: #aaa;
        font-size: 11px;
      }

      /* -------------------------
       Responsive
    ------------------------- */

      @media (max-width: 1000px) {
        .list-row {
          grid-template-columns:
            minmax(0, 2fr)
            minmax(150px, 1.4fr)
            minmax(90px, 0.8fr)
            minmax(170px, 1.3fr)
            minmax(75px, 0.6fr);
          gap: 8px;
          padding: 9px;
        }
      }

      @media (max-width: 760px) {
        .container {
          width: min(100% - 20px, 1500px);
          padding-top: 15px;
        }

        h1 {
          font-size: 23px;
        }

        .controls {
          padding: 12px;
        }

        .control-row {
          display: grid;
          grid-template-columns: 1fr;
        }

        .search {
          width: 100%;
        }

        .select {
          width: 100%;
        }

        .view-buttons {
          width: 100%;
        }

        .view-button {
          flex: 1;
        }

        .products.panel {
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }

        /*
       * 1行表示でも横スクロールさせず、
       * 5列を縦方向に再構成
       */

        .products.list {
          gap: 8px;
        }

        .list-row {
          display: grid;
          grid-template-columns:
            minmax(0, 1fr)
            auto;
          gap: 7px 10px;
          padding: 10px;
        }

        .list-main {
          grid-column: 1 / 3;
        }

        .list-sku-tags {
          grid-column: 1 / 2;
        }

        .list-dates {
          grid-column: 1 / 2;
        }

        .list-price {
          grid-column: 2 / 3;
          grid-row: 2 / 4;
          align-self: center;
          text-align: right;
        }

        /*
       * 販売中 / Sold out は一番右
       */

        .list-status {
          grid-column: 2 / 3;
          grid-row: 4;
          text-align: right;
          align-self: end;
        }
      }

      @media (max-width: 480px) {
        .products.panel {
          grid-template-columns: 1fr;
        }

        .tabs {
          margin-left: -4px;
          margin-right: -4px;
        }

        .tab {
          padding: 8px 12px;
        }

        .list-row {
          font-size: 12px;
        }

        .badge {
          font-size: 10px;
          padding: 2px 5px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>商品監視</h1>
        <div class="subtitle">GitHub Actions監視商品 + 手動登録商品</div>
      </header>

      <div id="error" class="error"></div>

      <div id="tabs" class="tabs"></div>

      <section class="controls">
        ```
        <div class="control-row">
          <div class="search">
            <input
              id="search"
              type="search"
              placeholder="商品名・SKU・タグ・カテゴリを検索"
              autocomplete="off"
            />
          </div>

          <select id="sort" class="select">
            <option value="custom">指定の並び順</option>

            <option value="created_desc">作成日の降順</option>

            <option value="sku_asc">SKUの昇順</option>

            <option value="sku_desc">SKUの降順</option>
          </select>

          <div class="view-buttons">
            <button id="panelView" class="view-button active" type="button">
              パネル
            </button>

            <button id="listView" class="view-button" type="button">1行</button>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-title">販売状態</div>

          <div id="statusFilters" class="status-buttons">
            <button
              class="status-button active"
              data-status="all"
              type="button"
            >
              すべて
            </button>

            <button class="status-button" data-status="available" type="button">
              販売中
            </button>

            <button class="status-button" data-status="soldout" type="button">
              Sold out
            </button>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-title">カテゴリ</div>

          <div id="categoryFilters" class="filter-buttons"></div>
        </div>

        <div class="filter-section">
          <div class="filter-title">タグ</div>

          <div id="tagFilters" class="filter-buttons"></div>
        </div>
        ```
      </section>

      <div class="info">
        ```
        <div id="count">0件</div>

        <div id="updated">最終更新: -</div>
        ```
      </div>

      <div id="loading" class="loading">読み込み中...</div>

      <main id="products" class="products panel"></main>

      <footer>
        Last updated:
        <span id="footerUpdated">-</span>
      </footer>
    </div>

    <script>
      "use strict";

      /*
       * ==========================================================
       * 設定
       * ==========================================================
       *
       * ★ここだけ自分のCloudflare Worker URLに変更
       *
       * 例:
       * https://monitoring-shop-fms-api.xxxxx.workers.dev
       *
       */

      const WORKER_URL =
        "https://monitoring-shop-fms-api.hidukiyuki.workers.dev/";

      /*
       * GitHub Pages上のデータ
       */

      const MONITORS_URL = "./monitors.json";

      /*
       * fallbackとして直接読むデータ
       */

      const DEFAULT_DATA_URL = "./data/products.json";

      /*
       * ==========================================================
       * State
       * ==========================================================
       */

      let monitors = [];

      let allProducts = [];

      let activeMonitor = "all";

      let activeStatus = "all";

      let activeCategories = new Set();

      let activeTags = new Set();

      let currentView = "panel";

      let currentSort = "custom";

      let lastUpdated = null;

      /*
       * ==========================================================
       * Utility
       * ==========================================================
       */

      function escapeHtml(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function normalize(value) {
        return String(value ?? "")
          .trim()
          .toLowerCase();
      }

      function parseDate(value) {
        if (!value) {
          return 0;
        }

        const timestamp = Date.parse(value);

        return Number.isNaN(timestamp) ? 0 : timestamp;
      }

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return value;
        }

        return date.toLocaleString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatPrice(value) {
        if (value === null || value === undefined || value === "") {
          return "-";
        }

        const number = Number(value);

        if (Number.isNaN(number)) {
          return escapeHtml(value);
        }

        return "¥" + number.toLocaleString("ja-JP");
      }

      function arrayValue(value) {
        if (Array.isArray(value)) {
          return value.filter(Boolean).map((value) => String(value));
        }

        if (typeof value === "string") {
          /*
           * JSON配列
           */

          try {
            const parsed = JSON.parse(value);

            if (Array.isArray(parsed)) {
              return parsed.filter(Boolean).map((value) => String(value));
            }
          } catch (_) {}

          /*
           * カンマ区切り
           */

          return value
            .split(",")
            .map((value) => value.trim())
            .filter(Boolean);
        }

        return [];
      }

      /*
       * ==========================================================
       * 商品正規化
       * ==========================================================
       */

      function normalizeProduct(product, monitorName) {
        const variants = Array.isArray(product.variants)
          ? product.variants
          : [];

        const firstVariant = variants[0] || {};

        /*
         * SKU
         *
         * variants[0].sku を優先
         */

        const sku = product.sku || firstVariant.sku || "";

        /*
         * 価格
         */

        const price = product.price ?? firstVariant.price ?? 0;

        /*
         * 販売状態
         */

        let available = product.available;

        if (available === undefined || available === null) {
          if (variants.length) {
            available = variants.some((variant) => variant.available !== false);
          } else {
            available = true;
          }
        }

        /*
         * タグ
         */

        const tags = arrayValue(product.tags);

        /*
         * カテゴリ
         *
         * category / product_type / type
         */

        const category =
          product.category || product.product_type || product.type || "";

        /*
         * 日付
         */

        const createdAt = product.created_at || firstVariant.created_at || "";

        const updatedAt = product.updated_at || firstVariant.updated_at || "";

        /*
         * 画像
         */

        let imageUrl = product.image_url || product.image || "";

        if (!imageUrl && product.images && product.images.length) {
          const image = product.images[0];

          if (typeof image === "string") {
            imageUrl = image;
          } else {
            imageUrl = image.src || image.url || "";
          }
        }

        /*
         * URL
         */

        const url =
          product.url || product.handle
            ? product.url || location.origin + "/products/" + product.handle
            : "";

        /*
         * ID
         */

        const id = String(
          product.id ||
            product.product_id ||
            product.handle ||
            cryptoRandomFallback(),
        );

        return {
          id,

          title: product.title || "",

          sku,

          price,

          available: Boolean(available),

          category,

          tags,

          created_at: createdAt,

          updated_at: updatedAt,

          image_url: imageUrl,

          url,

          source: product.source || "monitor",

          source_name: product.source_name || monitorName || "",

          monitor: product.monitor || monitorName || "",

          custom_order: Number(
            product.custom_order ?? product.position ?? 999999,
          ),
        };
      }

      function cryptoRandomFallback() {
        return Date.now() + "-" + Math.random().toString(36).slice(2);
      }

      /*
       * ==========================================================
       * monitors.json
       * ==========================================================
       */

      async function loadMonitors() {
        const response = await fetch(MONITORS_URL + "?t=" + Date.now(), {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error("monitors.json の取得に失敗しました");
        }

        const data = await response.json();

        /*
         * 想定:
         *
         * {
         *   "monitors": [...]
         * }
         *
         * または
         *
         * [...]
         */

        if (Array.isArray(data)) {
          return data;
        }

        if (Array.isArray(data.monitors)) {
          return data.monitors;
        }

        return [];
      }

      /*
       * ==========================================================
       * GitHub JSON
       * ==========================================================
       */

      async function fetchJson(url) {
        const response = await fetch(
          url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(),
          {
            cache: "no-store",
          },
        );

        if (!response.ok) {
          throw new Error(`${url}\nHTTP ${response.status}`);
        }

        const data = await response.json();

        return data;
      }

      function productsFromJson(data, monitorName) {
        /*
         * products.json
         */

        if (Array.isArray(data)) {
          return data.map((product) => normalizeProduct(product, monitorName));
        }

        if (Array.isArray(data.products)) {
          return data.products.map((product) =>
            normalizeProduct(product, monitorName),
          );
        }

        return [];
      }

      /*
       * ==========================================================
       * GitHub監視データ取得
       * ==========================================================
       */

      async function loadMonitorProducts() {
        const result = [];

        /*
         * monitors.jsonがある場合
         */

        if (monitors.length) {
          for (const monitor of monitors) {
            const name =
              monitor.name ||
              monitor.id ||
              monitor.title ||
              monitor.collection ||
              "";

            /*
             * data_url
             */

            let dataUrl =
              monitor.data_url || monitor.data || monitor.json_url || "";

            /*
             * docs/data/ を指定していない場合、
             * monitorのid/nameから推測
             */

            if (!dataUrl) {
              const id = monitor.id || monitor.slug || name;

              if (id) {
                dataUrl = `./data/${id}.json`;
              }
            }

            if (!dataUrl) {
              continue;
            }

            try {
              const data = await fetchJson(dataUrl);

              const products = productsFromJson(data, name);

              result.push(...products);
            } catch (error) {
              console.warn("監視データ取得失敗:", name, error);
            }
          }
        }

        /*
         * monitors.jsonが空だった場合の
         * fallback
         */

        if (result.length === 0) {
          try {
            const data = await fetchJson(DEFAULT_DATA_URL);

            result.push(...productsFromJson(data, "default"));
          } catch (error) {
            console.warn("default products.json取得失敗", error);
          }
        }

        return result;
      }

      /*
       * ==========================================================
       * Turso / Worker
       * ==========================================================
       */

      async function loadManualProducts() {
        /*
         * Worker URL未設定ならスキップ
         */

        if (!WORKER_URL || WORKER_URL.includes("YOUR-WORKER")) {
          console.warn("WORKER_URL が設定されていません");

          return [];
        }

        const response = await fetch(
          WORKER_URL.replace(/\/+$/, "") + "/products?t=" + Date.now(),
          {
            method: "GET",
            cache: "no-store",
          },
        );

        if (!response.ok) {
          throw new Error(`Worker /products HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data || !Array.isArray(data.products)) {
          return [];
        }

        return data.products.map((product) =>
          normalizeProduct(
            {
              ...product,
              source: product.source || "manual",
            },
            "手動登録",
          ),
        );
      }

      /*
       * ==========================================================
       * 重複除去
       * ==========================================================
       */

      function mergeProducts(monitorProducts, manualProducts) {
        const map = new Map();

        /*
         * 監視商品を先に入れる
         */

        for (const product of monitorProducts) {
          const key =
            product.id ||
            (product.sku ? "sku:" + product.sku : "title:" + product.title);

          map.set(key, product);
        }

        /*
         * 手動商品
         *
         * 基本的には別商品として扱う。
         * 同じIDの場合だけ上書き。
         */

        for (const product of manualProducts) {
          const key =
            product.id ||
            (product.sku
              ? "manual-sku:" + product.sku
              : "manual:" + product.title);

          map.set(key, product);
        }

        return Array.from(map.values());
      }

      /*
       * ==========================================================
       * Tabs
       * ==========================================================
       */

      function renderTabs() {
        const element = document.getElementById("tabs");

        element.innerHTML = "";

        const all = document.createElement("button");

        all.className = "tab" + (activeMonitor === "all" ? " active" : "");

        all.textContent = "すべて";

        all.addEventListener("click", () => {
          activeMonitor = "all";

          renderTabs();
          updateFilters();
          render();
        });

        element.appendChild(all);

        for (const monitor of monitors) {
          const id = String(monitor.id || monitor.name || monitor.slug);

          const button = document.createElement("button");

          button.className = "tab" + (activeMonitor === id ? " active" : "");

          button.textContent = monitor.name || monitor.title || id;

          button.addEventListener("click", () => {
            activeMonitor = id;

            renderTabs();
            updateFilters();
            render();
          });

          element.appendChild(button);
        }
      }

      /*
       * ==========================================================
       * Filter対象商品
       * ==========================================================
       */

      function getMonitorProducts() {
        if (activeMonitor === "all") {
          return allProducts;
        }

        return allProducts.filter((product) => {
          const monitor = normalize(product.monitor);

          const target = normalize(activeMonitor);

          return (
            monitor === target || String(product.source_name) === activeMonitor
          );
        });
      }

      /*
       * ==========================================================
       * Filters
       * ==========================================================
       */

      function updateFilters() {
        const products = getMonitorProducts();

        const categories = new Set();

        const tags = new Set();

        for (const product of products) {
          if (product.category) {
            categories.add(product.category);
          }

          for (const tag of product.tags) {
            tags.add(tag);
          }
        }

        /*
         * 選択状態のうち存在しなくなったものを削除
         */

        activeCategories = new Set(
          [...activeCategories].filter((category) => categories.has(category)),
        );

        activeTags = new Set([...activeTags].filter((tag) => tags.has(tag)));

        renderFilterButtons(
          "categoryFilters",
          [...categories].sort(localeSort),
          activeCategories,
        );

        renderFilterButtons(
          "tagFilters",
          [...tags].sort(localeSort),
          activeTags,
        );
      }

      function localeSort(a, b) {
        return String(a).localeCompare(String(b), "ja");
      }

      function renderFilterButtons(elementId, values, selectedSet) {
        const element = document.getElementById(elementId);

        element.innerHTML = "";

        if (values.length === 0) {
          const empty = document.createElement("span");

          empty.style.color = "#aaa";

          empty.style.fontSize = "12px";

          empty.textContent = "なし";

          element.appendChild(empty);

          return;
        }

        /*
         * 「すべて」
         */

        const allButton = document.createElement("button");

        allButton.type = "button";

        allButton.className =
          "filter-button" + (selectedSet.size === 0 ? " active" : "");

        allButton.textContent = "すべて";

        allButton.addEventListener("click", () => {
          selectedSet.clear();

          updateFilters();
          render();
        });

        element.appendChild(allButton);

        for (const value of values) {
          const button = document.createElement("button");

          button.type = "button";

          const selected = selectedSet.has(value);

          button.className = "filter-button" + (selected ? " active" : " off");

          button.textContent = value;

          button.addEventListener("click", () => {
            if (selectedSet.has(value)) {
              selectedSet.delete(value);
            } else {
              selectedSet.add(value);
            }

            updateFilters();
            render();
          });

          element.appendChild(button);
        }
      }

      /*
       * ==========================================================
       * Filtering
       * ==========================================================
       */

      function filteredProducts() {
        const search = normalize(document.getElementById("search").value);

        const products = getMonitorProducts();

        return products.filter((product) => {
          /*
           * 検索
           */

          if (search) {
            const haystack = [
              product.title,
              product.sku,
              product.category,
              ...product.tags,
              product.source_name,
            ]
              .join(" ")
              .toLowerCase();

            if (!haystack.includes(search)) {
              return false;
            }
          }

          /*
           * 販売状態
           */

          if (activeStatus === "available" && !product.available) {
            return false;
          }

          if (activeStatus === "soldout" && product.available) {
            return false;
          }

          /*
           * カテゴリ
           *
           * 複数ONの場合はOR
           */

          if (activeCategories.size) {
            if (!activeCategories.has(product.category)) {
              return false;
            }
          }

          /*
           * タグ
           *
           * 複数ONの場合はOR
           */

          if (activeTags.size) {
            const matched = product.tags.some((tag) => activeTags.has(tag));

            if (!matched) {
              return false;
            }
          }

          return true;
        });
      }

      /*
       * ==========================================================
       * Sorting
       * ==========================================================
       */

      function sortProducts(products) {
        const result = [...products];

        result.sort((a, b) => {
          /*
           * 指定の並び順
           */

          if (currentSort === "custom") {
            const orderA = Number(a.custom_order ?? 999999);

            const orderB = Number(b.custom_order ?? 999999);

            if (orderA !== orderB) {
              return orderA - orderB;
            }

            /*
             * 指定順が同じなら
             * 作成日降順
             */

            const dateDiff = parseDate(b.created_at) - parseDate(a.created_at);

            if (dateDiff !== 0) {
              return dateDiff;
            }

            /*
             * 最後にSKU降順
             */

            return String(b.sku || "").localeCompare(String(a.sku || ""), "ja");
          }

          /*
           * 作成日降順
           */

          if (currentSort === "created_desc") {
            const diff = parseDate(b.created_at) - parseDate(a.created_at);

            if (diff !== 0) {
              return diff;
            }

            return String(b.sku || "").localeCompare(String(a.sku || ""), "ja");
          }

          /*
           * SKU昇順
           */

          if (currentSort === "sku_asc") {
            return String(a.sku || "").localeCompare(String(b.sku || ""), "ja");
          }

          /*
           * SKU降順
           */

          if (currentSort === "sku_desc") {
            return String(b.sku || "").localeCompare(String(a.sku || ""), "ja");
          }

          return 0;
        });

        return result;
      }

      /*
       * ==========================================================
       * Badges
       * ==========================================================
       */

      function categoryBadge(category) {
        if (!category) {
          return "";
        }

        return `
    <span class="badge category">
      ${escapeHtml(category)}
    </span>
  `;
      }

      function tagBadges(tags) {
        return tags
          .map(
            (tag) => `
        <span class="badge tag">
          ${escapeHtml(tag)}
        </span>
      `,
          )
          .join("");
      }

      function manualBadge(product) {
        if (product.source !== "manual") {
          return "";
        }

        return `
    <span class="badge manual">
      手動登録
    </span>
  `;
      }

      /*
       * ==========================================================
       * Panel
       * ==========================================================
       */

      function renderPanel(products) {
        const container = document.getElementById("products");

        container.className = "products panel";

        if (products.length === 0) {
          container.innerHTML = `
      <div class="empty">
        条件に一致する商品はありません。
      </div>
    `;

          return;
        }

        container.innerHTML = products
          .map((product) => {
            const title = escapeHtml(product.title);

            const image = product.image_url
              ? `
              <img
                class="product-image"
                src="${escapeHtml(product.image_url)}"
                alt="${title}"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="
                  this.style.display='none';
                "
              >
            `
              : `
              <div class="product-image no-image">
                No Image
              </div>
            `;

            const titleHtml = product.url
              ? `
              <a
                href="${escapeHtml(product.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${title}
              </a>
            `
              : title;

            return `
          <article class="product-card">

            ${image}

            <div class="product-body">

              <div class="product-title">
                ${titleHtml}
              </div>

              <div class="sku">
                SKU:
                ${escapeHtml(product.sku || "-")}
              </div>

              <div class="badge-row">
                ${categoryBadge(product.category)}

                ${tagBadges(product.tags)}

                ${manualBadge(product)}
              </div>

              <div class="price">
                ${formatPrice(product.price)}
              </div>

              <div class="
                status
                ${product.available ? "available" : "soldout"}
              ">
                ${product.available ? "販売中" : "Sold out"}
              </div>

              <div class="dates">

                作成日:
                ${escapeHtml(formatDate(product.created_at))}

                <br>

                更新日:
                ${escapeHtml(formatDate(product.updated_at))}

              </div>

              ${
                product.source_name
                  ? `
                    <div class="source">
                      ${escapeHtml(product.source_name)}
                    </div>
                  `
                  : ""
              }

            </div>
          </article>
        `;
          })
          .join("");
      }

      /*
       * ==========================================================
       * One line
       * ==========================================================
       */

      function renderList(products) {
        const container = document.getElementById("products");

        container.className = "products list";

        if (products.length === 0) {
          container.innerHTML = `
      <div class="empty">
        条件に一致する商品はありません。
      </div>
    `;

          return;
        }

        container.innerHTML = products
          .map((product) => {
            const title = escapeHtml(product.title);

            const titleHtml = product.url
              ? `
              <a
                href="${escapeHtml(product.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${title}
              </a>
            `
              : title;

            /*
             * SKU + カテゴリ + タグ
             * 同じ列
             */

            const skuCategoryTags = `
          <div class="list-sku-tags">

            <div class="list-sku">
              SKU:
              ${escapeHtml(product.sku || "-")}
            </div>

            <div class="badge-row">

              ${categoryBadge(product.category)}

              ${tagBadges(product.tags)}

              ${manualBadge(product)}

            </div>

          </div>
        `;

            /*
             * 作成日 + 更新日
             * 同じ列
             */

            const dates = `
          <div class="list-dates">

            作成:
            ${escapeHtml(formatDate(product.created_at))}

            <br>

            更新:
            ${escapeHtml(formatDate(product.updated_at))}

          </div>
        `;

            return `
          <article class="list-row">

            <div class="list-main">

              <div class="list-title">
                ${titleHtml}
              </div>

              ${
                product.source_name
                  ? `
                    <div class="list-meta">
                      ${escapeHtml(product.source_name)}
                    </div>
                  `
                  : ""
              }

            </div>


            ${skuCategoryTags}


            <div class="list-price">
              ${formatPrice(product.price)}
            </div>


            ${dates}


            <!--
              販売状態は一番右
            -->

            <div class="
              list-status
              ${product.available ? "available" : "soldout"}
            ">

              ${product.available ? "販売中" : "Sold out"}

            </div>

          </article>
        `;
          })
          .join("");
      }

      /*
       * ==========================================================
       * Render
       * ==========================================================
       */

      function render() {
        const filtered = filteredProducts();

        const products = sortProducts(filtered);

        document.getElementById("count").textContent =
          `${products.length}件 / ${getMonitorProducts().length}件`;

        if (currentView === "list") {
          renderList(products);
        } else {
          renderPanel(products);
        }
      }

      /*
       * ==========================================================
       * Events
       * ==========================================================
       */

      document.getElementById("search").addEventListener("input", render);

      document.getElementById("sort").addEventListener("change", (event) => {
        currentSort = event.target.value;

        render();
      });

      document.getElementById("panelView").addEventListener("click", () => {
        currentView = "panel";

        document.getElementById("panelView").classList.add("active");

        document.getElementById("listView").classList.remove("active");

        render();
      });

      document.getElementById("listView").addEventListener("click", () => {
        currentView = "list";

        document.getElementById("listView").classList.add("active");

        document.getElementById("panelView").classList.remove("active");

        render();
      });

      document.querySelectorAll(".status-button").forEach((button) => {
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".status-button")
            .forEach((item) => item.classList.remove("active"));

          button.classList.add("active");

          activeStatus = button.dataset.status;

          render();
        });
      });

      /*
       * ==========================================================
       * Init
       * ==========================================================
       */

      async function init() {
        const loading = document.getElementById("loading");

        const error = document.getElementById("error");

        try {
          loading.style.display = "block";

          error.style.display = "none";

          /*
           * ① monitors.json
           */

          try {
            monitors = await loadMonitors();
          } catch (monitorError) {
            console.warn(monitorError);

            monitors = [];
          }

          renderTabs();

          /*
           * ② GitHub監視商品
           */

          const monitorProducts = await loadMonitorProducts();

          /*
           * ③ Turso手動商品
           */

          let manualProducts = [];

          try {
            manualProducts = await loadManualProducts();
          } catch (manualError) {
            console.warn("手動商品取得失敗:", manualError);

            /*
             * Workerが落ちていても
             * GitHub監視商品は表示する
             */

            manualProducts = [];
          }

          /*
           * ④ 統合
           */

          allProducts = mergeProducts(monitorProducts, manualProducts);

          /*
           * ⑤ 最終更新時刻
           */

          lastUpdated = new Date();

          const updatedText = formatDate(lastUpdated);

          document.getElementById("updated").textContent =
            "最終更新: " + updatedText;

          document.getElementById("footerUpdated").textContent = updatedText;

          /*
           * ⑥ Filter
           */

          updateFilters();

          /*
           * ⑦ Render
           */

          render();
        } catch (err) {
          console.error(err);

          error.textContent =
            "データの読み込みに失敗しました。\n\n" +
            (err && err.message ? err.message : String(err));

          error.style.display = "block";

          /*
           * エラー時も空表示
           */

          allProducts = [];

          render();
        } finally {
          loading.style.display = "none";
        }
      }

      init();
    </script>
  </body>
</html>
