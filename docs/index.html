<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FINDME STORE / ヰ世界情緒</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #f5f5f5;
        color: #222;
      }

      header {
        background: #fff;
        border-bottom: 1px solid #ddd;
        padding: 24px;
      }

      .header-inner {
        max-width: 1400px;
        margin: auto;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      .info {
        color: #777;
        font-size: 14px;
      }

      .controls {
        max-width: 1400px;
        margin: 20px auto;
        padding: 0 20px;
      }

      .search {
        width: 100%;
        padding: 14px 16px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 16px;
        background: #fff;
      }

      .filter-row {
        display: flex;
        gap: 8px;

        flex-wrap: wrap;

        margin-top: 12px;
      }

      button,
      select {
        padding: 9px 13px;

        border: 1px solid #ccc;

        border-radius: 6px;

        background: #fff;

        cursor: pointer;
      }

      button:hover {
        background: #f0f0f0;
      }

      button.active {
        background: #222;
        color: #fff;
        border-color: #222;
      }

      select {
        font-size: 14px;
      }

      main {
        max-width: 1400px;
        margin: auto;

        padding: 0 20px 40px;
      }

      .count {
        color: #777;
        margin-bottom: 10px;
      }

      .products {
        background: #fff;

        border-radius: 8px;

        overflow: hidden;
      }

      .product {
        display: grid;

        grid-template-columns:
          120px
          minmax(200px, 1fr)
          150px
          120px;

        gap: 20px;

        align-items: center;

        padding: 16px;

        border-bottom: 1px solid #eee;
      }

      .product:last-child {
        border-bottom: none;
      }

      .product-image {
        width: 110px;
        height: 110px;

        object-fit: contain;

        background: #fafafa;

        border-radius: 6px;
      }

      .product-title {
        font-size: 16px;
        font-weight: 600;

        margin-bottom: 5px;
      }

      .product-title a {
        color: inherit;
        text-decoration: none;
      }

      .product-title a:hover {
        text-decoration: underline;
      }

      .handle {
        font-size: 12px;
        color: #999;

        margin-bottom: 8px;
      }

      .product-tags {
        display: flex;

        gap: 5px;

        flex-wrap: wrap;
      }

      .tag {
        display: inline-block;

        padding: 3px 7px;

        border-radius: 4px;

        background: #eee;

        color: #666;

        font-size: 12px;
      }

      .price {
        font-size: 16px;
        font-weight: 600;
      }

      .status {
        display: inline-block;

        padding: 5px 9px;

        border-radius: 5px;

        font-size: 13px;

        white-space: nowrap;
      }

      .available {
        background: #dff5df;
        color: #176b17;
      }

      .soldout {
        background: #eee;
        color: #777;
      }

      .no-results {
        padding: 60px 20px;

        text-align: center;

        color: #888;
      }

      .loading {
        padding: 60px 20px;

        text-align: center;

        color: #888;
      }

      @media (max-width: 800px) {
        header {
          padding: 18px;
        }

        .controls,
        main {
          padding-left: 10px;
          padding-right: 10px;
        }

        .product {
          grid-template-columns: 80px 1fr;

          gap: 12px;
        }

        .product-image {
          width: 75px;
          height: 75px;
        }

        .price {
          grid-column: 2;
        }

        .status {
          grid-column: 2;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-inner">
        <h1>FINDME STORE / ヰ世界情緒</h1>

        <div class="info">
          最終取得:
          <span id="updated"> 読み込み中... </span>

          &nbsp;&nbsp; 商品数:
          <span id="total"> - </span>
        </div>
      </div>
    </header>

    <section class="controls">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="商品名・handle・タグで検索..."
      />

      <div class="filter-row">
        <button class="status-filter active" data-status="all">すべて</button>

        <button class="status-filter" data-status="available">🟢 販売中</button>

        <button class="status-filter" data-status="soldout">🔴 Sold out</button>

        <select id="sort">
          <option value="default">デフォルト順</option>

          <option value="price-asc">価格が安い順</option>

          <option value="price-desc">価格が高い順</option>

          <option value="title-asc">商品名 A→Z</option>

          <option value="title-desc">商品名 Z→A</option>
        </select>
      </div>

      <div id="tagFilters" class="filter-row"></div>
    </section>

    <main>
      <div class="count">
        表示:
        <span id="visibleCount"> - </span>
        商品
      </div>

      <div id="products" class="products">
        <div class="loading">商品データを読み込んでいます...</div>
      </div>
    </main>

    <script>
      let allProducts = [];

      let currentStatus = "all";

      let currentTag = "all";

      /*
============================================================
HTML escape
============================================================
*/

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /*
============================================================
Load JSON
============================================================
*/

      async function loadProducts() {
        try {
          const response = await fetch("./data/products.json?" + Date.now());

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const data = await response.json();

          /*
        新形式
        {
            updated_at,
            product_count,
            products
        }
        */

          if (data.products && typeof data.products === "object") {
            allProducts = Object.values(data.products);

            if (data.updated_at) {
              document.getElementById("updated").textContent = new Date(
                data.updated_at,
              ).toLocaleString("ja-JP");
            }
          } else if (typeof data === "object") {
            /*
        念のため旧形式にも対応
        */
            allProducts = Object.values(data);

            document.getElementById("updated").textContent = "不明";
          }

          document.getElementById("total").textContent = allProducts.length;

          buildTagFilters();

          render();
        } catch (error) {
          console.error(error);

          document.getElementById("products").innerHTML = `

                <div class="no-results">

                    商品データの読み込みに失敗しました。

                    <br><br>

                    ${escapeHtml(error.message)}

                </div>

            `;
        }
      }

      /*
============================================================
Tags
============================================================
*/

      function buildTagFilters() {
        const tags = new Set();

        allProducts.forEach((product) => {
          (product.tags || []).forEach((tag) => tags.add(tag));
        });

        const container = document.getElementById("tagFilters");

        container.innerHTML = "";

        const allButton = document.createElement("button");

        allButton.textContent = "全タグ";

        allButton.classList.add("active");

        allButton.onclick = () => {
          currentTag = "all";

          document
            .querySelectorAll("#tagFilters button")
            .forEach((button) => button.classList.remove("active"));

          allButton.classList.add("active");

          render();
        };

        container.appendChild(allButton);

        [...tags]
          .sort((a, b) => a.localeCompare(b, "ja"))
          .forEach((tag) => {
            const button = document.createElement("button");

            button.textContent = tag;

            button.onclick = () => {
              currentTag = tag;

              document
                .querySelectorAll("#tagFilters button")
                .forEach((button) => button.classList.remove("active"));

              button.classList.add("active");

              render();
            };

            container.appendChild(button);
          });
      }

      /*
============================================================
Availability
============================================================
*/

      function isAvailable(product) {
        return (product.variants || []).some(
          (variant) => variant.available === true,
        );
      }

      /*
============================================================
Price
============================================================
*/

      function getPrice(product) {
        const prices = (product.variants || [])
          .map((variant) => Number(variant.price))
          .filter((price) => Number.isFinite(price));

        if (!prices.length) {
          return null;
        }

        return Math.min(...prices);
      }

      function formatPrice(product) {
        const price = getPrice(product);

        if (price === null) {
          return "価格不明";
        }

        return price.toLocaleString("ja-JP") + " 円";
      }

      /*
============================================================
Render
============================================================
*/

      function render() {
        const search = document
          .getElementById("search")
          .value.trim()
          .toLowerCase();

        const sort = document.getElementById("sort").value;

        let products = [...allProducts];

        /*
    Filter
    */

        products = products.filter((product) => {
          const available = isAvailable(product);

          if (currentStatus === "available" && !available) {
            return false;
          }

          if (currentStatus === "soldout" && available) {
            return false;
          }

          if (
            currentTag !== "all" &&
            !(product.tags || []).includes(currentTag)
          ) {
            return false;
          }

          if (search) {
            const text = [
              product.title,

              product.handle,

              ...(product.tags || []),
            ]
              .join(" ")
              .toLowerCase();

            if (!text.includes(search)) {
              return false;
            }
          }

          return true;
        });

        /*
    Sort
    */

        products.sort((a, b) => {
          if (sort === "price-asc") {
            return (getPrice(a) ?? Infinity) - (getPrice(b) ?? Infinity);
          }

          if (sort === "price-desc") {
            return (getPrice(b) ?? -Infinity) - (getPrice(a) ?? -Infinity);
          }

          if (sort === "title-asc") {
            return (a.title || "").localeCompare(b.title || "", "ja");
          }

          if (sort === "title-desc") {
            return (b.title || "").localeCompare(a.title || "", "ja");
          }

          return 0;
        });

        /*
    Count
    */

        document.getElementById("visibleCount").textContent = products.length;

        /*
    Empty
    */

        if (!products.length) {
          document.getElementById("products").innerHTML = `

                <div class="no-results">

                    条件に一致する商品がありません。

                </div>

            `;

          return;
        }

        /*
    Product HTML
    */

        document.getElementById("products").innerHTML = products
          .map((product) => {
            const available = isAvailable(product);

            const image =
              product.images && product.images.length ? product.images[0] : "";

            const tags = (product.tags || [])
              .map(
                (tag) =>
                  `
                            <span class="tag">
                                ${escapeHtml(tag)}
                            </span>
                            `,
              )
              .join("");

            return `

                <article class="product">


                    <div>

                        ${
                          image
                            ? `

                            <img
                                class="product-image"
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(product.title)}"
                                loading="lazy"
                            >

                            `
                            : ""
                        }

                    </div>


                    <div>


                        <div class="product-title">

                            <a
                                href="${escapeHtml(product.url)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                ${escapeHtml(product.title)}

                            </a>

                        </div>


                        <div class="handle">

                            ${escapeHtml(product.handle)}

                        </div>


                        <div class="product-tags">

                            ${tags}

                        </div>


                    </div>


                    <div class="price">

                        ${formatPrice(product)}

                    </div>


                    <div>

                        <span class="
                            status
                            ${available ? "available" : "soldout"}
                        ">

                            ${available ? "🟢 販売中" : "🔴 Sold out"}

                        </span>

                    </div>


                </article>

                `;
          })
          .join("");
      }

      /*
============================================================
 Search
============================================================
*/

      document.getElementById("search").addEventListener("input", render);

      /*
============================================================
 Sort
============================================================
*/

      document.getElementById("sort").addEventListener("change", render);

      /*
============================================================
 Status filter
============================================================
*/

      document.querySelectorAll(".status-filter").forEach((button) => {
        button.addEventListener("click", () => {
          currentStatus = button.dataset.status;

          document
            .querySelectorAll(".status-filter")
            .forEach((button) => button.classList.remove("active"));

          button.classList.add("active");

          render();
        });
      });

      /*
============================================================
 Start
============================================================
*/

      loadProducts();
    </script>
  </body>
</html>
