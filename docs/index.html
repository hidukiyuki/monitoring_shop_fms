<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FINDME STORE / ヰ世界情緒</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #f5f5f5;

        color: #222;
      }

      header {
        background: #fff;

        border-bottom: 1px solid #ddd;

        padding: 24px;
      }

      .header-inner {
        max-width: 1400px;

        margin: auto;
      }

      h1 {
        margin: 0 0 8px;

        font-size: 24px;
      }

      .info {
        color: #777;

        font-size: 14px;
      }

      .controls {
        max-width: 1400px;

        margin: 20px auto;

        padding: 0 20px;
      }

      .search {
        width: 100%;

        padding: 14px 16px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 16px;

        background: #fff;
      }

      .tabs {
        display: flex;

        gap: 8px;

        margin-top: 15px;

        flex-wrap: wrap;
      }

      .tab {
        padding: 10px 16px;

        border: 1px solid #ccc;

        border-radius: 6px;

        background: #fff;

        cursor: pointer;

        font-size: 14px;
      }

      .tab.active {
        background: #222;

        color: #fff;

        border-color: #222;
      }

      .filter-row {
        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        margin-top: 10px;
      }

      button,
      select {
        padding: 8px 12px;

        border: 1px solid #ccc;

        border-radius: 6px;

        background: #fff;

        cursor: pointer;
      }

      button.active {
        background: #222;

        color: #fff;

        border-color: #222;
      }

      main {
        max-width: 1400px;

        margin: auto;

        padding: 0 20px 40px;
      }

      .count {
        color: #777;

        margin-bottom: 10px;
      }

      .products {
        background: #fff;

        border-radius: 8px;

        overflow: hidden;
      }

      .product {
        display: grid;

        grid-template-columns:
          120px
          minmax(200px, 1fr)
          150px
          120px;

        gap: 20px;

        align-items: center;

        padding: 16px;

        border-bottom: 1px solid #eee;
      }

      .product:last-child {
        border-bottom: none;
      }

      .product-image {
        width: 110px;

        height: 110px;

        object-fit: contain;

        background: #fafafa;

        border-radius: 6px;
      }

      .product-title {
        font-size: 16px;

        font-weight: 600;

        margin-bottom: 5px;
      }

      .product-title a {
        color: inherit;

        text-decoration: none;
      }

      .product-title a:hover {
        text-decoration: underline;
      }

      .handle {
        font-size: 12px;

        color: #999;

        margin-bottom: 8px;
      }

      .product-tags {
        display: flex;

        gap: 5px;

        flex-wrap: wrap;
      }

      .tag {
        padding: 3px 7px;

        border-radius: 4px;

        background: #eee;

        color: #666;

        font-size: 12px;
      }

      .price {
        font-weight: 600;
      }

      .status {
        display: inline-block;

        padding: 5px 9px;

        border-radius: 5px;

        font-size: 13px;

        white-space: nowrap;
      }

      .available {
        background: #dff5df;

        color: #176b17;
      }

      .soldout {
        background: #eee;

        color: #777;
      }

      .hidden {
        background: #ffe0e0;

        color: #a00000;
      }

      .history-info {
        margin-top: 8px;

        color: #777;

        font-size: 12px;

        line-height: 1.7;
      }

      .no-results,
      .loading {
        padding: 60px 20px;

        text-align: center;

        color: #888;
      }

      @media (max-width: 800px) {
        header {
          padding: 18px;
        }

        .controls,
        main {
          padding-left: 10px;

          padding-right: 10px;
        }

        .product {
          grid-template-columns: 80px 1fr;

          gap: 12px;
        }

        .product-image {
          width: 75px;

          height: 75px;
        }

        .price,
        .status {
          grid-column: 2;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-inner">
        <h1>FINDME STORE / ヰ世界情緒</h1>

        <div class="info">
          最終取得:
          <span id="updated"> 読み込み中... </span>

          &nbsp;&nbsp; 登録商品:
          <span id="total"> - </span>
        </div>
      </div>
    </header>

    <section class="controls">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="商品名・handle・タグで検索..."
      />

      <div class="tabs">
        <button class="tab active" data-mode="current">現在の商品</button>

        <button class="tab" data-mode="hidden">非表示商品</button>

        <button class="tab" data-mode="history">全履歴</button>
      </div>

      <div id="statusFilters" class="filter-row">
        <button class="status-filter active" data-status="all">すべて</button>

        <button class="status-filter" data-status="available">🟢 販売中</button>

        <button class="status-filter" data-status="soldout">🔴 Sold out</button>
      </div>

      <div id="tagFilters" class="filter-row"></div>

      <div class="filter-row">
        <select id="sort">
          <option value="default">デフォルト順</option>

          <option value="price-asc">価格が安い順</option>

          <option value="price-desc">価格が高い順</option>

          <option value="title-asc">商品名 A→Z</option>

          <option value="title-desc">商品名 Z→A</option>

          <option value="first-seen">初回確認が新しい順</option>

          <option value="last-seen">最終確認が新しい順</option>
        </select>
      </div>
    </section>

    <main>
      <div class="count">
        表示:
        <span id="visibleCount"> - </span>
        件
      </div>

      <div id="products" class="products">
        <div class="loading">読み込み中...</div>
      </div>
    </main>

    <script>
      let products = [];

      let history = [];

      let mode = "current";

      let statusFilter = "all";

      let tagFilter = "all";

      /* ============================================================
   Escape
============================================================ */

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* ============================================================
   Load
============================================================ */

      async function loadData() {
        try {
          const [productsResponse, historyResponse] = await Promise.all([
            fetch("./data/products.json?" + Date.now()),

            fetch("./data/history.json?" + Date.now()),
          ]);

          if (!productsResponse.ok || !historyResponse.ok) {
            throw new Error("データ取得失敗");
          }

          const productData = await productsResponse.json();

          const historyData = await historyResponse.json();

          products = Object.values(productData.products || {});

          history = Object.values(historyData.history || {});

          document.getElementById("updated").textContent = new Date(
            productData.updated_at,
          ).toLocaleString("ja-JP");

          document.getElementById("total").textContent = history.length;

          buildTagFilters();

          render();
        } catch (error) {
          console.error(error);

          document.getElementById("products").innerHTML = `

                <div class="no-results">

                    データの読み込みに失敗しました。

                    <br><br>

                    ${escapeHtml(error.message)}

                </div>

            `;
        }
      }

      /* ============================================================
   Availability
============================================================ */

      function isAvailable(product) {
        if (product.last) {
          return product.last.available === true;
        }

        return (product.variants || []).some(
          (variant) => variant.available === true,
        );
      }

      /* ============================================================
   Price
============================================================ */

      function getPrice(product) {
        if (product.last && product.last.price) {
          const value = Number(product.last.price);

          return Number.isFinite(value) ? value : null;
        }

        const prices = (product.variants || [])
          .map((variant) => Number(variant.price))
          .filter(Number.isFinite);

        if (!prices.length) {
          return null;
        }

        return Math.min(...prices);
      }

      function formatPrice(product) {
        const price = getPrice(product);

        if (price === null) {
          return "価格不明";
        }

        return price.toLocaleString("ja-JP") + " 円";
      }

      /* ============================================================
   Tags
============================================================ */

      function getTags(product) {
        if (product.last && product.last.tags) {
          return product.last.tags;
        }

        return product.tags || [];
      }

      function buildTagFilters() {
        const tags = new Set();

        history.forEach((product) => {
          getTags(product).forEach((tag) => tags.add(tag));
        });

        const container = document.getElementById("tagFilters");

        container.innerHTML = "";

        const allButton = document.createElement("button");

        allButton.textContent = "全タグ";

        allButton.classList.add("active");

        allButton.onclick = () => {
          tagFilter = "all";

          document
            .querySelectorAll("#tagFilters button")
            .forEach((b) => b.classList.remove("active"));

          allButton.classList.add("active");

          render();
        };

        container.appendChild(allButton);

        [...tags]
          .sort((a, b) => a.localeCompare(b, "ja"))
          .forEach((tag) => {
            const button = document.createElement("button");

            button.textContent = tag;

            button.onclick = () => {
              tagFilter = tag;

              document
                .querySelectorAll("#tagFilters button")
                .forEach((b) => b.classList.remove("active"));

              button.classList.add("active");

              render();
            };

            container.appendChild(button);
          });
      }

      /* ============================================================
   Filtering
============================================================ */

      function matchesSearch(product, search) {
        if (!search) {
          return true;
        }

        const text = [product.title, product.handle, ...getTags(product)]
          .join(" ")
          .toLowerCase();

        return text.includes(search);
      }

      function filterProducts() {
        const search = document
          .getElementById("search")
          .value.trim()
          .toLowerCase();

        let source;

        if (mode === "current") {
          source = history.filter((product) => product.visible);
        } else if (mode === "hidden") {
          source = history.filter((product) => !product.visible);
        } else {
          source = [...history];
        }

        return source.filter((product) => {
          if (!matchesSearch(product, search)) {
            return false;
          }

          if (tagFilter !== "all" && !getTags(product).includes(tagFilter)) {
            return false;
          }

          if (mode === "current") {
            const available = isAvailable(product);

            if (statusFilter === "available" && !available) {
              return false;
            }

            if (statusFilter === "soldout" && available) {
              return false;
            }
          }

          return true;
        });
      }

      /* ============================================================
   Sort
============================================================ */

      function sortProducts(items) {
        const sort = document.getElementById("sort").value;

        items.sort((a, b) => {
          if (sort === "price-asc") {
            return (getPrice(a) ?? Infinity) - (getPrice(b) ?? Infinity);
          }

          if (sort === "price-desc") {
            return (getPrice(b) ?? -Infinity) - (getPrice(a) ?? -Infinity);
          }

          if (sort === "title-asc") {
            return (a.title || "").localeCompare(b.title || "", "ja");
          }

          if (sort === "title-desc") {
            return (b.title || "").localeCompare(a.title || "", "ja");
          }

          if (sort === "first-seen") {
            return new Date(b.first_seen) - new Date(a.first_seen);
          }

          if (sort === "last-seen") {
            return new Date(b.last_seen) - new Date(a.last_seen);
          }

          return 0;
        });

        return items;
      }

      /* ============================================================
   Render
============================================================ */

      function render() {
        let items = filterProducts();

        items = sortProducts(items);

        document.getElementById("visibleCount").textContent = items.length;

        const container = document.getElementById("products");

        if (!items.length) {
          container.innerHTML = `

            <div class="no-results">

                条件に一致する商品がありません。

            </div>

        `;

          return;
        }

        container.innerHTML = items
          .map((product) => renderProduct(product))
          .join("");
      }

      /* ============================================================
   Product card
============================================================ */

      function renderProduct(product) {
        const available = isAvailable(product);

        const tags = getTags(product)
          .map(
            (tag) =>
              `
                <span class="tag">
                    ${escapeHtml(tag)}
                </span>
                `,
          )
          .join("");

        const images = product.last?.images || product.images || [];

        const image = images[0] || "";

        const hidden = !product.visible;

        let statusHtml;

        if (hidden) {
          statusHtml = `

            <span class="status hidden">
                ⚫ 非表示
            </span>

        `;
        } else if (available) {
          statusHtml = `

            <span class="status available">
                🟢 販売中
            </span>

        `;
        } else {
          statusHtml = `

            <span class="status soldout">
                🔴 Sold out
            </span>

        `;
        }

        const historyInfo = `

        <div class="history-info">

            初回:
            ${formatDate(product.first_seen)}

            <br>

            最終:
            ${formatDate(product.last_seen)}

        </div>

    `;

        return `

    <article class="product">


        <div>

            ${
              image
                ? `

                <img
                    class="product-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.title)}"
                    loading="lazy"
                >

                `
                : ""
            }

        </div>


        <div>

            <div class="product-title">

                <a
                    href="${escapeHtml(product.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    ${escapeHtml(product.title)}

                </a>

            </div>


            <div class="handle">

                ${escapeHtml(product.handle)}

            </div>


            <div class="product-tags">

                ${tags}

            </div>


            ${mode !== "current" ? historyInfo : ""}


        </div>


        <div class="price">

            ${hidden ? "最終価格: " : ""}

            ${formatPrice(product)}

        </div>


        <div>

            ${statusHtml}

        </div>


    </article>

    `;
      }

      /* ============================================================
   Date
============================================================ */

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        return new Date(value).toLocaleString("ja-JP");
      }

      /* ============================================================
   Events
============================================================ */

      document.getElementById("search").addEventListener("input", render);

      document.getElementById("sort").addEventListener("change", render);

      document.querySelectorAll(".tab").forEach((button) => {
        button.addEventListener("click", () => {
          mode = button.dataset.mode;

          document
            .querySelectorAll(".tab")
            .forEach((b) => b.classList.remove("active"));

          button.classList.add("active");

          document.getElementById("statusFilters").style.display =
            mode === "current" ? "flex" : "none";

          render();
        });
      });

      document.querySelectorAll(".status-filter").forEach((button) => {
        button.addEventListener("click", () => {
          statusFilter = button.dataset.status;

          document
            .querySelectorAll(".status-filter")
            .forEach((b) => b.classList.remove("active"));

          button.classList.add("active");

          render();
        });
      });

      /* ============================================================
   Start
============================================================ */

      loadData();
    </script>
  </body>
</html>
