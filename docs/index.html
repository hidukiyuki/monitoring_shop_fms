    <script>
      "use strict";

      /* =========================================================
     State
     ========================================================= */

      let monitors = [];
      let currentMonitor = null;

      let originalProducts = [];

      let viewMode = "card";

      const selectedTags = new Set();
      const selectedCategories = new Set();
      const selectedAvailability = new Set();

      /* =========================================================
     DOM
     ========================================================= */

      const tabsEl = document.getElementById("tabs");

      const productsEl = document.getElementById("products");

      const loadingEl = document.getElementById("loading");

      const errorEl = document.getElementById("error");

      const warningEl = document.getElementById("warning");

      const statusEl = document.getElementById("status");

      const controlsEl = document.getElementById("controls");

      const searchEl = document.getElementById("search");

      const sortEl = document.getElementById("sort");

      const availabilityFiltersEl = document.getElementById(
        "availabilityFilters",
      );

      const categoryFiltersEl = document.getElementById("categoryFilters");

      const tagFiltersEl = document.getElementById("tagFilters");

      const clearFiltersEl = document.getElementById("clearFilters");

      const cardViewButton = document.getElementById("cardViewButton");

      const listViewButton = document.getElementById("listViewButton");

      const lastUpdatedEl = document.getElementById("lastUpdated");

      /* =========================================================
     Utility
     ========================================================= */

      function showError(message) {
        errorEl.textContent = message || "不明なエラー";

        errorEl.style.display = "block";
      }

      function clearError() {
        errorEl.textContent = "";
        errorEl.style.display = "none";
      }

      function showWarning(message) {
        warningEl.textContent = message || "";

        warningEl.style.display = message ? "block" : "none";
      }

      function escapeHtml(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate(value) {
        if (!value) {
          return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return date.toLocaleString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function timestamp(value) {
        if (!value) {
          return 0;
        }

        const time = new Date(value).getTime();

        return Number.isNaN(time) ? 0 : time;
      }

      function formatPrice(value) {
        if (value === null || value === undefined || value === "") {
          return "-";
        }

        const number = Number(value);

        if (Number.isNaN(number)) {
          return String(value);
        }

        return new Intl.NumberFormat("ja-JP").format(number) + "円";
      }

      /* =========================================================
     Monitor helpers
     ========================================================= */

      function getMonitorName(monitor) {
        return (
          monitor.name ||
          monitor.title ||
          monitor.collection ||
          monitor.slug ||
          "Monitor"
        );
      }

      function getMonitorCollection(monitor) {
        return monitor.collection || monitor.slug || monitor.name || "";
      }

      function getProductsPath(monitor) {
        if (monitor.products_path) {
          return monitor.products_path;
        }

        const collection = getMonitorCollection(monitor);

        return "./data/" + encodeURIComponent(collection) + "/products.json";
      }

      function getManualApiUrl(monitor) {
        /*
         * 優先順位
         *
         * monitor.manual_products_api
         * monitor.manual_api_url
         * monitor.manual_products_url
         * monitor.manual_api
         *
         * ↓
         *
         * monitors.json のトップレベル
         *
         * manual_products_api
         * manual_api_url
         * manual_products_url
         * manual_api
         */

        return (
          monitor.manual_products_api ||
          monitor.manual_api_url ||
          monitor.manual_products_url ||
          monitor.manual_api ||
          monitors.manual_products_api ||
          monitors.manual_api_url ||
          monitors.manual_products_url ||
          monitors.manual_api ||
          ""
        );
      }

      function isManualEnabled(monitor) {
        if (monitor.manual_products === false) {
          return false;
        }

        return Boolean(getManualApiUrl(monitor));
      }

      /* =========================================================
     Load monitors.json
     ========================================================= */

      async function loadMonitors() {
        const response = await fetch("./monitors.json?t=" + Date.now(), {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(
            "monitors.json の取得に失敗しました: HTTP " + response.status,
          );
        }

        const data = await response.json();

        if (Array.isArray(data)) {
          monitors = data;
        } else if (data && Array.isArray(data.monitors)) {
          monitors = data.monitors;

          /*
           * トップレベル設定も保持
           */
          monitors.manual_products_api = data.manual_products_api || "";

          monitors.manual_api_url = data.manual_api_url || "";

          monitors.manual_products_url = data.manual_products_url || "";

          monitors.manual_api = data.manual_api || "";
        } else {
          throw new Error(
            "monitors.json の形式が正しくありません。\n" +
              '配列または { "monitors": [...] } が必要です。',
          );
        }

        if (monitors.length === 0) {
          throw new Error("monitors.json に監視対象がありません。");
        }
      }

      /* =========================================================
     Tabs
     ========================================================= */

      function renderTabs() {
        tabsEl.innerHTML = "";

        monitors.forEach((monitor, index) => {
          const button = document.createElement("button");

          button.type = "button";

          button.className = "tab";

          if (index === 0) {
            button.classList.add("active");
          }

          button.textContent = getMonitorName(monitor);

          button.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach((tab) => {
              tab.classList.remove("active");
            });

            button.classList.add("active");

            loadMonitor(monitor);
          });

          tabsEl.appendChild(button);
        });
      }

      /* =========================================================
     JSON loader
     ========================================================= */

      async function fetchJson(path, label) {
        const separator = path.includes("?") ? "&" : "?";

        const response = await fetch(path + separator + "t=" + Date.now(), {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(
            label +
              " の取得に失敗しました: HTTP " +
              response.status +
              "\n" +
              path,
          );
        }

        try {
          return await response.json();
        } catch (error) {
          throw new Error(
            label +
              " のJSON解析に失敗しました。\n" +
              path +
              "\n" +
              error.message,
          );
        }
      }

      function extractProducts(data, label) {
        if (Array.isArray(data)) {
          return data;
        }

        if (data && Array.isArray(data.products)) {
          return data.products;
        }

        if (data && Array.isArray(data.data)) {
          return data.data;
        }

        if (data && data.data && Array.isArray(data.data.products)) {
          return data.data.products;
        }

        throw new Error(
          label +
            " の形式が正しくありません。\n" +
            "配列、{ products: [...] }、または { data: [...] } が必要です。",
        );
      }

      /* =========================================================
     Load Shopify products
     ========================================================= */

      async function loadShopProducts(monitor) {
        const path = getProductsPath(monitor);

        const data = await fetchJson(path, "products.json");

        return extractProducts(data, "products.json");
      }

      /* =========================================================
     Load Turso manual products
     ========================================================= */

      async function loadManualProducts(monitor) {
        const apiUrl = getManualApiUrl(monitor);

        if (!apiUrl) {
          return [];
        }

        const data = await fetchJson(apiUrl, "Turso手動商品API");

        const products = extractProducts(data, "Turso手動商品API");

        /*
         * manual=trueを付与
         *
         * Shopify商品と区別するため
         */
        return products.map((product) => ({
          ...product,
          manual: true,
          source:
            product.source ||
            product.sales_source ||
            product.shop ||
            "手動登録",
        }));
      }

      /* =========================================================
     Merge products
     ========================================================= */

      async function loadAllProducts(monitor) {
        const shopProducts = await loadShopProducts(monitor);

        let manualProducts = [];

        if (isManualEnabled(monitor)) {
          try {
            manualProducts = await loadManualProducts(monitor);
          } catch (error) {
            console.error(error);

            showWarning(
              "Tursoの手動商品を取得できませんでした。\n" + error.message,
            );
          }
        }

        /*
         * Shopify商品は
         * manual=false
         */
        const normalizedShop = shopProducts.map((product) => ({
          ...product,
          manual: product.manual === true ? true : false,
        }));

        return [...normalizedShop, ...manualProducts];
      }

      /* =========================================================
     Product helpers
     ========================================================= */

      function getVariant(product) {
        if (
          !product ||
          !Array.isArray(product.variants) ||
          product.variants.length === 0
        ) {
          return null;
        }

        return product.variants[0];
      }

      function getSku(product) {
        const variant = getVariant(product);

        return String(variant?.sku || product.sku || "");
      }

      function getPrice(product) {
        const variant = getVariant(product);

        const value = Number(variant?.price ?? product.price ?? 0);

        return Number.isNaN(value) ? 0 : value;
      }

      function getCreatedAt(product) {
        const variant = getVariant(product);

        return variant?.created_at || product.created_at || "";
      }

      function getUpdatedAt(product) {
        const variant = getVariant(product);

        return variant?.updated_at || product.updated_at || "";
      }

      function isAvailable(product) {
        if (Array.isArray(product.variants) && product.variants.length > 0) {
          return product.variants.some(
            (variant) =>
              variant &&
              (variant.available === true ||
                variant.available === 1 ||
                variant.available === "true"),
          );
        }

        if (typeof product.available === "boolean") {
          return product.available;
        }

        if (product.available === 1 || product.available === "true") {
          return true;
        }

        if (typeof product.status === "string") {
          const status = product.status.toLowerCase().trim();

          if (
            status === "available" ||
            status === "販売中" ||
            status === "in_stock"
          ) {
            return true;
          }
        }

        /*
         * manual商品では
         * availabilityを利用
         */
        if (typeof product.availability === "boolean") {
          return product.availability;
        }

        return false;
      }

      function getImage(product) {
        if (Array.isArray(product.images) && product.images.length > 0) {
          const image = product.images[0];

          if (typeof image === "string") {
            return image;
          }

          if (image && typeof image === "object") {
            return image.src || image.url || "";
          }
        }

        if (typeof product.image === "string") {
          return product.image;
        }

        if (product.image && typeof product.image === "object") {
          return product.image.src || product.image.url || "";
        }

        return "";
      }

      function getProductUrl(product) {
        if (product.url) {
          return String(product.url);
        }

        if (product.product_url) {
          return String(product.product_url);
        }

        if (product.external_url) {
          return String(product.external_url);
        }

        if (product.handle) {
          return (
            "https://findmestore.thinkr.jp/products/" +
            encodeURIComponent(product.handle)
          );
        }

        return "";
      }

      function normalizeArray(value) {
        if (Array.isArray(value)) {
          return value.map((item) => String(item).trim()).filter(Boolean);
        }

        if (typeof value === "string") {
          return value
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean);
        }

        return [];
      }

      function getTags(product) {
        return normalizeArray(product.tags);
      }

      function getCategories(product) {
        const value =
          product.category ??
          product.categories ??
          product.product_type ??
          product.type ??
          "";

        return normalizeArray(value);
      }

      function getSource(product) {
        if (product.source) {
          return String(product.source);
        }

        if (product.sales_source) {
          return String(product.sales_source);
        }

        if (product.shop) {
          return String(product.shop);
        }

        return "";
      }

      /* =========================================================
     Filter values
     ========================================================= */

      function collectFilterValues() {
        const tags = new Set();

        const categories = new Set();

        originalProducts.forEach((product) => {
          getTags(product).forEach((tag) => tags.add(tag));

          getCategories(product).forEach((category) =>
            categories.add(category),
          );
        });

        return {
          tags: Array.from(tags).sort((a, b) => a.localeCompare(b, "ja")),

          categories: Array.from(categories).sort((a, b) =>
            a.localeCompare(b, "ja"),
          ),
        };
      }

      /* =========================================================
     Filter button
     ========================================================= */

      function renderFilterButton(container, label, active, callback) {
        const button = document.createElement("button");

        button.type = "button";

        button.className = "filter-button";

        if (active) {
          button.classList.add("active");
        }

        button.textContent = label;

        button.addEventListener("click", callback);

        container.appendChild(button);
      }

      /* =========================================================
     Render filters
     ========================================================= */

      function renderFilters() {
        availabilityFiltersEl.innerHTML = "";

        categoryFiltersEl.innerHTML = "";

        tagFiltersEl.innerHTML = "";

        renderFilterButton(
          availabilityFiltersEl,
          "販売中",
          selectedAvailability.has("available"),
          () => {
            if (selectedAvailability.has("available")) {
              selectedAvailability.delete("available");
            } else {
              selectedAvailability.add("available");
            }

            renderFilters();
            renderProducts();
          },
        );

        renderFilterButton(
          availabilityFiltersEl,
          "Sold out",
          selectedAvailability.has("soldout"),
          () => {
            if (selectedAvailability.has("soldout")) {
              selectedAvailability.delete("soldout");
            } else {
              selectedAvailability.add("soldout");
            }

            renderFilters();
            renderProducts();
          },
        );

        const values = collectFilterValues();

        if (values.categories.length === 0) {
          const empty = document.createElement("span");

          empty.textContent = "カテゴリなし";

          empty.style.color = "#999";

          empty.style.fontSize = "12px";

          categoryFiltersEl.appendChild(empty);
        } else {
          values.categories.forEach((category) => {
            renderFilterButton(
              categoryFiltersEl,
              category,
              selectedCategories.has(category),
              () => {
                if (selectedCategories.has(category)) {
                  selectedCategories.delete(category);
                } else {
                  selectedCategories.add(category);
                }

                renderFilters();
                renderProducts();
              },
            );
          });
        }

        if (values.tags.length === 0) {
          const empty = document.createElement("span");

          empty.textContent = "タグなし";

          empty.style.color = "#999";

          empty.style.fontSize = "12px";

          tagFiltersEl.appendChild(empty);
        } else {
          values.tags.forEach((tag) => {
            renderFilterButton(tagFiltersEl, tag, selectedTags.has(tag), () => {
              if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
              } else {
                selectedTags.add(tag);
              }

              renderFilters();
              renderProducts();
            });
          });
        }
      }

      /* =========================================================
     Match filters
     ========================================================= */

      function matchesFilter(product) {
        const keyword = searchEl.value.trim().toLowerCase();

        if (keyword) {
          const title = String(product.title || "").toLowerCase();

          const sku = getSku(product).toLowerCase();

          const source = getSource(product).toLowerCase();

          const tags = getTags(product).join(" ").toLowerCase();

          const categories = getCategories(product).join(" ").toLowerCase();

          if (
            !title.includes(keyword) &&
            !sku.includes(keyword) &&
            !source.includes(keyword) &&
            !tags.includes(keyword) &&
            !categories.includes(keyword)
          ) {
            return false;
          }
        }

        if (selectedAvailability.size > 0) {
          const key = isAvailable(product) ? "available" : "soldout";

          if (!selectedAvailability.has(key)) {
            return false;
          }
        }

        if (selectedCategories.size > 0) {
          const categories = getCategories(product);

          const matched = categories.some((category) =>
            selectedCategories.has(category),
          );

          if (!matched) {
            return false;
          }
        }

        if (selectedTags.size > 0) {
          const tags = getTags(product);

          const matched = tags.some((tag) => selectedTags.has(tag));

          if (!matched) {
            return false;
          }
        }

        return true;
      }

      /* =========================================================
     Sorting
     ========================================================= */

      function sortProducts(products) {
        const sort = sortEl.value;

        if (sort === "default") {
          return products;
        }

        if (sort === "created_desc") {
          products.sort(
            (a, b) => timestamp(getCreatedAt(b)) - timestamp(getCreatedAt(a)),
          );
        }

        if (sort === "sku_desc") {
          products.sort((a, b) =>
            getSku(b).localeCompare(getSku(a), "ja", {
              numeric: true,
              sensitivity: "base",
            }),
          );
        }

        if (sort === "sku_asc") {
          products.sort((a, b) =>
            getSku(a).localeCompare(getSku(b), "ja", {
              numeric: true,
              sensitivity: "base",
            }),
          );
        }

        if (sort === "price_asc") {
          products.sort((a, b) => getPrice(a) - getPrice(b));
        }

        if (sort === "price_desc") {
          products.sort((a, b) => getPrice(b) - getPrice(a));
        }

        if (sort === "created_asc") {
          products.sort(
            (a, b) => timestamp(getCreatedAt(a)) - timestamp(getCreatedAt(b)),
          );
        }

        if (sort === "updated_desc") {
          products.sort(
            (a, b) => timestamp(getUpdatedAt(b)) - timestamp(getUpdatedAt(a)),
          );
        }

        if (sort === "updated_asc") {
          products.sort(
            (a, b) => timestamp(getUpdatedAt(a)) - timestamp(getUpdatedAt(b)),
          );
        }

        return products;
      }

      /* =========================================================
     Render products
     ========================================================= */

      function renderProducts() {
        productsEl.innerHTML = "";

        productsEl.classList.toggle("list-view", viewMode === "list");

        let products = originalProducts.filter(matchesFilter);

        products = sortProducts(products);

        if (products.length === 0) {
          productsEl.innerHTML =
            '<div class="loading">該当する商品がありません。</div>';

          updateStatus(0);

          return;
        }

        products.forEach((product) => {
          const card = document.createElement("div");

          card.className = "product";

          const image = getImage(product);

          const available = isAvailable(product);

          const sku = getSku(product);

          const price = getPrice(product);

          const createdAt = getCreatedAt(product);

          const updatedAt = getUpdatedAt(product);

          const categories = getCategories(product);

          const tags = getTags(product);

          const url = getProductUrl(product);

          const manual = product.manual === true;

          const source = getSource(product);

          /* ===================================================
           Image
           =================================================== */

          if (image) {
            const img = document.createElement("img");

            img.className = "product-image";

            img.src = image;

            img.alt = product.title || "";

            img.loading = "lazy";

            img.referrerPolicy = "no-referrer";

            img.onerror = function () {
              this.style.visibility = "hidden";
            };

            card.appendChild(img);
          }

          /* ===================================================
           Body
           =================================================== */

          const body = document.createElement("div");

          body.className = "product-body";

          /* ===================================================
           Availability
           =================================================== */

          const availabilityEl = document.createElement("div");

          availabilityEl.className =
            "availability " + (available ? "available" : "soldout");

          availabilityEl.textContent = available ? "販売中" : "Sold out";

          body.appendChild(availabilityEl);

          if (manual) {
            const badge = document.createElement("span");

            badge.className = "manual-badge";

            badge.textContent = "手動登録";

            body.appendChild(badge);
          }

          /* ===================================================
           Source
           =================================================== */

          if (manual && source) {
            const sourceEl = document.createElement("div");

            sourceEl.className = "product-source";

            sourceEl.textContent = "販売元: " + source;

            body.appendChild(sourceEl);
          }

          /* ===================================================
           Title
           =================================================== */

          const titleEl = document.createElement("div");

          titleEl.className = "product-title";

          titleEl.textContent = product.title || product.name || "名称未設定";

          body.appendChild(titleEl);

          /* ===================================================
           Price
           =================================================== */

          const priceEl = document.createElement("div");

          priceEl.className = "product-price";

          priceEl.textContent = formatPrice(price);

          body.appendChild(priceEl);

          /* ===================================================
           Meta
           SKU / Category / Tags
           =================================================== */

          const metaEl = document.createElement("div");

          metaEl.className = "product-meta";

          const skuEl = document.createElement("div");

          skuEl.className = "sku";

          skuEl.innerHTML = "<strong>SKU:</strong> " + escapeHtml(sku || "-");

          metaEl.appendChild(skuEl);

          const categoryChips = document.createElement("div");

          categoryChips.className = "category-chips";

          if (categories.length > 0) {
            categories.forEach((category) => {
              const chip = document.createElement("span");

              chip.className = "category-chip";

              chip.textContent = category;

              categoryChips.appendChild(chip);
            });
          } else {
            const chip = document.createElement("span");

            chip.className = "category-chip";

            chip.textContent = "-";

            categoryChips.appendChild(chip);
          }

          metaEl.appendChild(categoryChips);

          const tagChips = document.createElement("div");

          tagChips.className = "tag-chips";

          tags.forEach((tag) => {
            const chip = document.createElement("span");

            chip.className = "tag-chip";

            chip.textContent = tag;

            tagChips.appendChild(chip);
          });

          metaEl.appendChild(tagChips);

          body.appendChild(metaEl);

          /* ===================================================
           Dates
           =================================================== */

          const datesEl = document.createElement("div");

          datesEl.className = "product-dates";

          const createdEl = document.createElement("div");

          createdEl.className = "date";

          createdEl.innerHTML =
            "<strong>作成:</strong> " + escapeHtml(formatDate(createdAt));

          datesEl.appendChild(createdEl);

          const updatedEl = document.createElement("div");

          updatedEl.className = "date";

          updatedEl.innerHTML =
            "<strong>更新:</strong> " + escapeHtml(formatDate(updatedAt));

          datesEl.appendChild(updatedEl);

          body.appendChild(datesEl);

          /* ===================================================
           Product link
           =================================================== */

          if (url) {
            const link = document.createElement("a");

            link.className = "product-link";

            link.href = url;

            link.target = "_blank";

            link.rel = "noopener noreferrer";

            link.textContent = "商品ページ →";

            body.appendChild(link);
          }

          card.appendChild(body);

          productsEl.appendChild(card);
        });

        updateStatus(products.length);
      }

      /* =========================================================
     Status
     ========================================================= */

      function updateStatus(displayedCount) {
        const total = originalProducts.length;

        const available = originalProducts.filter((product) =>
          isAvailable(product),
        ).length;

        const soldout = total - available;

        const manual = originalProducts.filter(
          (product) => product.manual === true,
        ).length;

        statusEl.innerHTML =
          "<span>商品数: <strong>" +
          total +
          "</strong></span>" +
          "<span>表示中: <strong>" +
          displayedCount +
          "</strong></span>" +
          "<span>販売中: <strong>" +
          available +
          "</strong></span>" +
          "<span>Sold out: <strong>" +
          soldout +
          "</strong></span>" +
          (manual > 0
            ? "<span>手動登録: <strong>" + manual + "</strong></span>"
            : "");

        statusEl.style.display = "flex";
      }

      /* =========================================================
     Load monitor
     ========================================================= */

      async function loadMonitor(monitor) {
        currentMonitor = monitor;

        loadingEl.style.display = "block";

        productsEl.innerHTML = "";

        controlsEl.style.display = "none";

        statusEl.style.display = "none";

        clearError();
        showWarning("");

        selectedTags.clear();
        selectedCategories.clear();
        selectedAvailability.clear();

        searchEl.value = "";

        sortEl.value = "default";

        try {
          const products = await loadAllProducts(monitor);

          originalProducts = Array.isArray(products) ? products : [];

          if (originalProducts.length === 0) {
            showError(
              "商品データは取得できましたが、商品が0件です。\n" +
                getProductsPath(monitor),
            );
          }

          renderFilters();

          controlsEl.style.display = "block";

          renderProducts();

          const manualEnabled = isManualEnabled(monitor);

          const manualCount = originalProducts.filter(
            (product) => product.manual === true,
          ).length;

          lastUpdatedEl.textContent =
            "監視対象: " +
            getMonitorName(monitor) +
            "　｜　" +
            (manualEnabled ? "手動商品: " + manualCount + "件　｜　" : "") +
            "最終読み込み: " +
            formatDate(new Date());
        } catch (error) {
          console.error(error);

          originalProducts = [];

          showError(error.message || "データの読み込みに失敗しました");
        } finally {
          loadingEl.style.display = "none";
        }
      }

      /* =========================================================
     View switch
     ========================================================= */

      cardViewButton.addEventListener("click", () => {
        viewMode = "card";

        cardViewButton.classList.add("active");

        listViewButton.classList.remove("active");

        renderProducts();
      });

      listViewButton.addEventListener("click", () => {
        viewMode = "list";

        listViewButton.classList.add("active");

        cardViewButton.classList.remove("active");

        renderProducts();
      });

      /* =========================================================
     Clear filters
     ========================================================= */

      clearFiltersEl.addEventListener("click", () => {
        selectedTags.clear();
        selectedCategories.clear();
        selectedAvailability.clear();

        searchEl.value = "";

        sortEl.value = "default";

        renderFilters();
        renderProducts();
      });

      /* =========================================================
     Search
     ========================================================= */

      searchEl.addEventListener("input", () => {
        renderProducts();
      });

      /* =========================================================
     Sort
     ========================================================= */

      sortEl.addEventListener("change", () => {
        renderProducts();
      });

      /* =========================================================
     Init
     ========================================================= */

      async function init() {
        try {
          await loadMonitors();

          renderTabs();

          await loadMonitor(monitors[0]);
        } catch (error) {
          console.error(error);

          loadingEl.style.display = "none";

          showError(error.message || "初期化に失敗しました");
        }
      }

      init();
    </script>
